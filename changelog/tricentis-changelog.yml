summary: >-
  Tricentis has no single platform changelog. Releases are announced per product,
  on a calendar-versioned YYYY.N train, through dated Product Updates posts on the
  corporate blog and through per-product release-notes trees in the documentation
  portal. API-affecting changes (rate limiting, SDK end-of-support, pagination and
  validation changes) are announced separately on the qTest End of Support
  Announcements page rather than in a per-endpoint API changelog.
scheme: calendar
scheme_detail: YYYY.N release trains per product (e.g. NeoLoad 2026.1, Tosca 2024.2,
  Vera 2025.1); legacy qTest builds used semver (9.x, 10.x, 11.x) before switching to
  the 2023.3+ calendar train.
