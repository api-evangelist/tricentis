aid: tricentis
name: Tricentis
description: Tricentis is an enterprise continuous testing and quality engineering company, founded
  in Austria in 2007 and headquartered in Vienna with US operations in Austin, Texas. Its platform
  spans model-based UI and API test automation (Tosca, Tosca Cloud), AI-driven test management (qTest),
  performance testing (NeoLoad), Jira-native test management (Tricentis Test Management for Jira),
  SAP change impact analysis (LiveCompare), data and ETL validation (Data Integrity), regulated-industry
  validation (Vera), and quality analytics. Tricentis exposes machine-readable REST contracts for
  qTest Manager, Parameters, Pulse, Scenario, Sessions, Data Export and Analytics, for NeoLoad Web,
  and for Tricentis Test Management for Jira, and it was among the first enterprise quality-engineering
  vendors to ship remote Model Context Protocol (MCP) servers plus an open-source, Apache-2.0 catalog
  of agent skills for driving Tosca and qTest from AI coding assistants.
