components:
  parameters:
    search:
      name: $search
      in: query
      description: Search items by search phrases, see [Searching](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionsearch)
      schema:
        type: string
    top:
      name: $top
      in: query
      description: Show only the first n items, see [Paging - Top](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptiontop)
      schema:
        type: integer
        minimum: 0
      example: 50
    count:
      name: $count
      in: query
      description: Include count of items, see [Count](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptioncount)
      schema:
        type: boolean
    skip:
      name: $skip
      in: query
      description: Skip the first n items, see [Paging - Skip](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionskip)
      schema:
        type: integer
        minimum: 0
  responses:
    error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  schemas:
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
            innererror:
              type: object
              description: The structure of this object is service-specific
    count:
      anyOf:
      - type: number
      - type: string
      description: The number of entities in the collection. Available when using the [$count](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptioncount) query option.
    x26997ea37814ba1b9a423c590887c7a7c1262datasource.requirementtestcase:
      title: requirementtestcase
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          maxLength: 32768
        clientid:
          anyOf:
          - type: integer
          - type: string
          format: int64
          example: '42'
        projectid:
          anyOf:
          - type: integer
          - type: string
          format: int64
          example: '42'
        requirementid:
          anyOf:
          - type: integer
          - type: string
          format: int64
          example: '42'
        testcaseid:
          anyOf:
          - type: integer
          - type: string
          format: int64
          example: '42'
        folderid:
          anyOf:
          - type: integer
          - type: string
          format: int64
          example: '42'
        executionenddateid:
          type:
          - string
          - 'null'
          maxLength: 32768
        executionenddate:
          type:
          - string
          - 'null'
          format: date
          example: '2017-04-13'
        totaltestexecutions:
          type:
          - integer
          - 'null'
          format: int32
        totaltestexecutiontime:
          anyOf:
          - type: integer
          - type: string
          format: int64
          example: '42'
        passedtestexecutions:
          type:
          - integer
          - 'null'
          format: int32
        failedtestexecutions:
          type:
          - integer
          - 'null'
          format: int32
        blockedtestexecutions:
          type:
          - integer
          - 'null'
          format: int32
        incompletetestexecutions:
          type:
          - integer
          - 'null'
          format: int32
        unexecutedtestexecutions:
          type:
          - integer
          - 'null'
          format: int32
        ssor:
          type:
          - string
          - 'null'
          maxLength: 32768
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apikey
