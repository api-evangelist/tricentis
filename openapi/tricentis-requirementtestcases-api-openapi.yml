        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - id
            - clientid
            - projectid
            - requirementid
            - testcaseid
            - folderid
            - executionenddateid
            - executionenddate
            - totaltestexecutions
            - totaltestexecutiontime
            - passedtestexecutions
            - failedtestexecutions
            - blockedtestexecutions
            - incompletetestexecutions
            - unexecutedtestexecutions
            - ssor
      responses:
        '200':
          description: Retrieved entities
          content:
            application/json:
              schema:
                type: object
                title: Collection of requirementtestcase
                properties:
                  '@odata.count':
                    $ref: '#/components/schemas/count'
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/x26997ea37814ba1b9a423c590887c7a7c1262datasource.requirementtestcase'
        4XX:
          $ref: '#/components/responses/error'
  /requirementtestcases('{id}'):
    parameters:
    - description: 'key: id'
      in: path
      name: id
      required: true
      schema:
        type:
        - string
        - 'null'
        maxLength: 32768
    get:
      summary: Get entity from requirementtestcases by key
      tags:
      - requirementtestcases
      parameters:
      - name: $select
        description: Select properties to be returned, see [Select](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionselect)
