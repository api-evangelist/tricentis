openapi: 3.2.0
info:
  version: '3.0'
  title: NeoLoad Results API
security:
- NeoloadAuthorizer: []
tags:
- name: Results
paths:
  /v3/workspaces/{workspaceId}/test-results:
    get:
      operationId: GetTestResultList
      summary: Lists Test Results
      description: "Lists the Test Results of the Workspace according to the method parameters.\n___\n*Sortable fields :*\n  - name\n  - project\n  - startDate (descending sort by default : the most recent first)\n  - qualityStatus\n"
      tags:
      - Results
      parameters:
      - $ref: '#/components/parameters/workspace-id'
      - name: status
        in: query
        required: false
        description: Returns only the Test Results with the specified status.
        schema:
          type: string
          enum:
          - STARTING
          - RUNNING
          - TERMINATED
      - name: project
        in: query
        required: false
        description: Project name. Returns only the Test Results of the specified project.
        schema:
          type: string
      - name: author
        in: query
        required: false
        description: The author of the Test Result. Returns only the Test Results launched by the specified author.
        schema:
          type: string
      - $ref: '#/components/parameters/page_limit'
      - $ref: '#/components/parameters/page_offset'
      - $ref: '#/components/parameters/single_sort'
      - name: fields
        in: query
        required: false
        description: Comma-separated list of fields to include in the json Test Result definition.
        schema:
          type: string
      - name: pretty
        in: query
        required: false
        description: If true the Json returned is human readable.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfTestResultDefinition'
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '403':
          $ref: '#/components/responses/error_403'
        '404':
          $ref: '#/components/responses/error_404'
        '429':
          $ref: '#/components/responses/error_429'
        '500':
          $ref: '#/components/responses/error_500'
  /v3/workspaces/{workspaceId}/test-results/{resultId}:
    get:
      operationId: GetTestResult
      summary: Test Result description
      description: Provides a Test Result description using a unique Test Result identifier. Provides name, dates, owner ...
      tags:
      - Results
      parameters:
      - $ref: '#/components/parameters/workspace-id'
      - $ref: '#/components/parameters/result-id'
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResultDefinition'
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '403':
          $ref: '#/components/responses/error_403'
        '404':
          $ref: '#/components/responses/error_404'
        '429':
          $ref: '#/components/responses/error_429'
        '500':
          $ref: '#/components/responses/error_500'
    delete:
      operationId: DeleteTestResult
      summary: Deletes a Test Result
      description: Deletes a Test Result and all the associated statistics. This action cannot be undone.
      tags:
      - Results
      parameters:
      - $ref: '#/components/parameters/workspace-id'
      - $ref: '#/components/parameters/result-id'
      responses:
        '204':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '403':
          $ref: '#/components/responses/error_403'
        '404':
          $ref: '#/components/responses/error_404'
        '429':
          $ref: '#/components/responses/error_429'
        '500':
          $ref: '#/components/responses/error_500'
    patch:
      operationId: UpdateTestResult
      summary: Partially update a Test Result
      description: Updates the specified fields of a Test Result. All fields are optional.
      tags:
      - Results
      parameters:
      - $ref: '#/components/parameters/workspace-id'
      - $ref: '#/components/parameters/result-id'
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResultDefinition'
        '204':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '403':
          $ref: '#/components/responses/error_403'
        '404':
          $ref: '#/components/responses/error_404'
        '413':
          $ref: '#/components/responses/error_413'
        '429':
          $ref: '#/components/responses/error_429'
        '500':
          $ref: '#/components/responses/error_500'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestResultUpdateRequest'
        required: true
  /v3/workspaces/{workspaceId}/test-results/{resultId}/logs:
    get:
      operationId: GetTestResultLogs
      summary: Get the logs from a test result
      description: The 1000th first lines of logs (timestamp, content and source) about a specified test result. If the test result does not have any logs the result will be an empty list.
      tags:
      - Results
      parameters:
      - $ref: '#/components/parameters/workspace-id'
      - $ref: '#/components/parameters/result-id'
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResultLogs'
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '403':
          $ref: '#/components/responses/error_403'
        '429':
          $ref: '#/components/responses/error_429'
        '500':
          $ref: '#/components/responses/error_500'
  /v3/workspaces/{workspaceId}/test-results/{resultId}/statistics:
    get:
      operationId: GetTestResultStatistics
      summary: Test Result main statistics
      description: Provides the main statistics of a Test Result. For a runnning test, these statistics are live, for a Test Result, those are average for the all Test Result.
      tags:
      - Results
      parameters:
      - $ref: '#/components/parameters/workspace-id'
      - $ref: '#/components/parameters/result-id'
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResultStatistics'
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '403':
          $ref: '#/components/responses/error_403'
        '404':
          $ref: '#/components/responses/error_404'
        '429':
          $ref: '#/components/responses/error_429'
        '500':
          $ref: '#/components/responses/error_500'
  /v3/workspaces/{workspaceId}/test-results/{resultId}/raw:
    get:
      operationId: GetTestRawResult
      summary: Test Result raw data
      description: 'Provides all the Test Result raw data, with a content as CSV or JSON file. <br /><br /> <b><i>This endpoint may produce large files depending on Test Results. For production purposes please prefer using an API client rather than the browser.</i></b> Provides the Test Result raw data for an element of category TRANSACTION, with a content as CSV or JSON file. <br /><br /> <b><i>Retention period for raw data is 7 days after which this will be permanently deleted.</i></b>

        '
      tags:
      - Results
      parameters:
      - $ref: '#/components/parameters/workspace-id'
      - $ref: '#/components/parameters/result-id'
      - $ref: '#/components/parameters/result-format'
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
                allOf:
                - $ref: '#/components/schemas/TestRawResult'
            application/json:
              schema:
                type: string
                format: binary
                allOf:
                - $ref: '#/components/schemas/TestRawResult'
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '403':
          $ref: '#/components/responses/error_403'
        '404':
          $ref: '#/components/responses/error_404'
        '429':
          $ref: '#/components/responses/error_429'
        '500':
          $ref: '#/components/responses/error_500'
components:
  parameters:
    result-format:
      name: format
      in: query
      required: true
      schema:
        type: string
        enum:
        - CSV
        - JSON
        default: CSV
      description: The format of the Test Result data.
    workspace-id:
      name: workspaceId
      in: path
      required: true
      description: Unique identifier representing a Workspace.
      schema:
        type: string
    page_offset:
      name: offset
      in: query
      required: false
      description: The offset of the first element to return. Starting at this offset, the query will return a maximum of 'limit' elements.
      schema:
        type: integer
        default: 0
    result-id:
      name: resultId
      in: path
      required: true
      description: Unique identifier representing a specific Test Result.
      schema:
        type: string
    page_limit:
      name: limit
      in: query
      required: false
      description: The maximum number of elements returned by this call. The maximum must be less than or equal to 200.
      schema:
        type: integer
        maximum: 200
        default: 50
    single_sort:
      name: sort
      in: query
      required: false
      description: The key to sort the elements on. It may begin with a '+' or a '-' to specify an ascending or descending sort order. The list of available keys can be found in the endpoint description.
      schema:
        type: string
  responses:
    error_413:
      description: Request entity too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    error_403:
      description: You are not allowed to process this request. Please verify the parameters and try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    error_400:
      description: An error occurred while processing the request. Please verify the parameters and try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    error_404:
      description: Resource not found. Please verify the parameters and try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    error_429:
      description: Too many requests. Your maximum number of requests per minute is reached. Try again soon.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
    error_500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    error_401:
      description: Unauthorized. You must provide an API token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    TestResultUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the Test Result.
        description:
          type: string
          description: Description of the Test Result.
        qualityStatus:
          type: string
          enum:
          - PASSED
          - FAILED
          description: Quality status of the Test Result.
        externalUrl:
          type: string
          description: Optional URL to an external system, for example the CI job's link.
        externalUrlLabel:
          type: string
          description: Optional label to describe the external URL, for example the CI name or job ID.
        isLocked:
          type: boolean
          description: Locks a Test Result (avoid automatic deletion).
        workspaceId:
          type: string
          description: Workspace of the Test Result. WARNING ! When moving a Test Result to another Workspace, all the dashboards data linked to the selected Test Results will be deleted! Running Test Results will not be moved.
        testId:
          type: string
          description: Test of the Test Result.
    TestResultLogs:
      type: object
      properties:
        content:
          type: string
          description: The content of the log.
        timestamp:
          type: integer
          format: int64
          description: The timestamp (GMT+0) in millisecond of the operation described by the content.
        type:
          type: string
          description: The source of the log line.
    RateLimitError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        retry-after:
          type: integer
    TestResultStatistics:
      type: object
      properties:
        totalRequestCountSuccess:
          type: integer
          format: int64
          description: Total number of requests in the scenario that did not encounter any error.
        totalRequestCountFailure:
          type: integer
          format: int64
          description: Total number of requests in the scenario that encountered errors.
        totalRequestDurationAverage:
          type: number
          format: float
          description: Average time in seconds for all requests of the scenario to be performed (from first byte sent to last byte received).
        totalRequestCountPerSecond:
          type: number
          format: float
          description: Total number of requests in the scenario that are performed per second.
        totalTransactionCountSuccess:
          type: integer
          format: int64
          description: Total number of the scenario Transactions executed without encountering any error.
        totalTransactionCountFailure:
          type: integer
          format: int64
          description: Total number of the scenario Transactions executed with errors.
        totalTransactionDurationAverage:
          type: number
          format: float
          description: Average time in seconds for all Transactions of the scenario to be executed.
        totalTransactionCountPerSecond:
          type: number
          format: float
          description: Total number of the scenario Transactions executed per second.
        totalIterationCountSuccess:
          type: integer
          format: int64
          description: Total number of times when the 'Actions' Container was run for each Virtual User without encountering any error.
        totalIterationCountFailure:
          type: integer
          format: int64
          description: Total number of times when the 'Actions' Container was run for each Virtual User and encountered an error.
        totalGlobalDownloadedBytes:
          type: integer
          format: int64
          description: Total size of http traffic received in bytes.
        totalGlobalDownloadedBytesPerSecond:
          type: number
          format: float
          description: Average size of http traffic received in bytes per second.
        totalGlobalCountFailure:
          type: integer
          format: int64
          description: ''
        lastRequestCountPerSecond:
          type: number
          format: float
          description: Last value received for the number of requests in the scenario that are performed per second.
        lastTransactionDurationAverage:
          type: number
          format: float
          description: Last value received for the average time in milliseconds for all Transactions of the scenario.
        lastVirtualUserCount:
          type: integer
          format: int32
          description: Last value received for the total number of Virtual Users executed in the test.
    TestResultDefinition:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Test Result.
        name:
          type: string
          description: Name of the Test Result.
        description:
          type: string
          description: Description of the Test Result.
        author:
          type: string
          description: First and Last name of the person who launched the test.
        terminationReason:
          type: string
          enum:
          - POLICY
          - VARIABLE
          - MANUAL
          - LG_AVAILABILITY
          - LICENSE
          - FAILED_TO_START
          - CANCELLED
          - RESERVATION_ENDED
          - UNKNOWN
          description: Reason that caused the test to end.
        lgCount:
          type: integer
          description: Total number of Load Generators used in the Test Result.
        project:
          type: string
          description: Name of the project.
        scenario:
          type: string
          description: Name of the scenario.
        status:
          type: string
          enum:
          - INIT
          - STARTING
          - RUNNING
          - TERMINATED
          - UNKNOWN
          description: Status of the Test Result.
        qualityStatus:
          type: string
          enum:
          - PASSED
          - FAILED
          - COMPUTING
          - UNKNOWN
          description: Quality status of the Test Result.
        startDate:
          type: integer
          format: int64
          description: Timestamp when the test started.
        endDate:
          type: integer
          format: int64
          description: Timestamp when the test ended.
        duration:
          type: integer
          format: int64
          description: Test duration in seconds.
        testId:
          type: string
          description: Unique identifier of the test.
          example: 5ed5350f-9f2f-4e2a-9acb-cdbcee874256
        externalUrl:
          type: string
          description: Optional URL to an external system, for example the CI job's link.
          example: https://dev.azure.com/myorg/myproject/_build?definitionId=123
        externalUrlLabel:
          type: string
          description: Optional label to describe the external URL, for example the CI name or job ID.
          example: AzureDevOps#123
        isLocked:
          type: boolean
          description: Locks a Test Result (avoid automatic deletion).
    TestRawResult:
      description: An array of object representing raw results.
      example:
      - Elapsed;Time;User Path;Virtual User ID;Parent;Element;Response time;Success;Population;Zone
      - 5559;2020-06-04T12:40:07.278+02:00;"BrowserUser_Create_report";0-7;"Actions";"Home";2929;yes;"MyPopulationSmallCities";"Default zone"
      - 5632;2020-06-04T12:40:07.351+02:00;"BrowserUser_Create_report";0-13;"Actions";"Home";3005;yes;"MyPopulationBigCities";"Default zone"
      - 12855;2020-06-04T12:40:14.574+02:00;"BrowserUser_Create_report";0-7;"Actions";"submit report";1968;yes;"MyPopulationSmallCities";"Default zone"
      - 29376;2020-06-04T12:40:31.095+02:00;"BrowserUser_Create_report";0-7;"Try";"submit";1377;yes;"MyPopulationSmallCities";"Default zone"
      type: array
      items:
        type: object
    ArrayOfTestResultDefinition:
      type: array
      items:
        $ref: '#/components/schemas/TestResultDefinition'
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      description: 'Existing error codes are:

        - HTTP 401 | Code: 101 | Message : Unauthorized, please provide an API token.

        - HTTP 429 | Code: 102 | Message : Too many requests, you reached your maximum number of requests per minute.

        - HTTP 403 | Code: 103 | Message : Unauthorized operation for the given API token, please provide an API token with sufficient privilege

        - HTTP 400 | Code: 104 | Message : Error while parsing json body.

        - HTTP 400 | Code: 105 | Message : Entity not in the specified Workspace.

        - HTTP 404 | Code: 201 | Message : Test Result not found.

        - HTTP 400 | Code: 202 | Message : Error while requesting the Test Result

        - HTTP 400 | Code: 203 | Message : Error while searching the Test Result

        - HTTP 400 | Code: 204 | Message : Type is mandatory as request parameter.

        - HTTP 400 | Code: 205 | Message : Invalid element type in request.

        - HTTP 400 | Code: 206 | Message : Error requesting aggregated values.

        - HTTP 400 | Code: 207 | Message : Error requesting elements.

        - HTTP 400 | Code: 208 | Message : Element ID is mandatory in request path.

        - HTTP 400 | Code: 209 | Message : Invalid element id in request.

        - HTTP 400 | Code: 210 | Message : Statistics is mandatory in request path.

        - HTTP 400 | Code: 211 | Message : Invalid statistic in request.

        - HTTP 400 | Code: 212 | Message : Error getting monitors.

        - HTTP 400 | Code: 213 | Message : Error getting monitor values.

        - HTTP 400 | Code: 214 | Message : Error getting monitor points.

        - HTTP 400 | Code: 215 | Message : Monitor ID is mandatory in request path.

        - HTTP 400 | Code: 216 | Message : Test ID is mandatory in request path.

        - HTTP 400 | Code: 217 | Message : Error while deleting the test. This test is not TERMINATED.

        - HTTP 400 | Code: 218 | Message : Error while deleting the test.

        - HTTP 400 | Code: 219 | Message : Error requesting aggregated points.

        - HTTP 400 | Code: 220 | Message : Error requesting SLA status for element.

        - HTTP 400 | Code: 221 | Message : Error updating a Test Result.

        - HTTP 404 | Code: 222 | Message : Fail to attach the Test Result to a Test because Test not found.

        - HTTP 204 | Code: 223 | Message : Update successful, no content.

        - HTTP 400 | Code: 224 | Message : Error while parsing json body for updating a test.

        - HTTP 400 | Code: 225 | Message : Error while parsing json body for custom monitors.

        - HTTP 400 | Code: 226 | Message : Error while creating custom monitors.

        - HTTP 400 | Code: 227 | Message : Path too long.

        - HTTP 400 | Code: 228 | Message : Clock Synchronization Issue: timestamp received before the beginning of the test.

        - HTTP 400 | Code: 229 | Message : Clock Synchronization Issue: timestamp received more than 10 minutes in the future.

        - HTTP 400 | Code: 230 | Message : Duplicate key: same timestamp and same path received in multiple requests.

        - HTTP 400 | Code: 231 | Message : Max number of Paths reached.

        - HTTP 400 | Code: 232 | Message : Max number of Monitors reached.

        - HTTP 400 | Code: 233 | Message : ''|'' character is not allowed.

        - HTTP 400 | Code: 234 | Message : A test is already launching.

        - HTTP 400 | Code: 235 | Message : Error while parsing the LG zones parameter.

        - HTTP 400 | Code: 236 | Message : NeoLoad project file ID does not exist.

        - HTTP 400 | Code: 237 | Message : NeoLoad project not found.

        - HTTP 400 | Code: 238 | Message : Upload project URL not found.

        - HTTP 400 | Code: 239 | Message : The scenario does not exist.

        - HTTP 400 | Code: 240 | Message : The size of the image to generate is invalid.

        - HTTP 400 | Code: 241 | Message : Reservation parameters are invalid.

        - HTTP 400 | Code: 242 | Message : Reservation duration must be at least 60 seconds.

        - HTTP 400 | Code: 243 | Message : Reservation not found.

        - HTTP 400 | Code: 244 | Message : Reservation is failed or not ready to use.

        - HTTP 400 | Code: 245 | Message : Reservation not matching scenario requirements: Number of virtual users.

        - HTTP 400 | Code: 246 | Message : Unauthorized Reservation

        - HTTP 400 | Code: 247 | Message : Error requesting SLA Per-Run of the Test Result.

        - HTTP 400 | Code: 248 | Message : Error requesting SLA Per-Run while the test is not terminated.

        - HTTP 400 | Code: 249 | Message : As-code file extension must be yaml, yml or json.

        - HTTP 400 | Code: 250 | Message : Error getting Test Results events.

        - HTTP 400 | Code: 251 | Message : Error requesting element.

        - HTTP 400 | Code: 252 | Message : Error requesting counter.

        - HTTP 400 | Code: 253 | Message : Invalid monitor id in request.

        - HTTP 400 | Code: 254 | Message : Invalid as-code file path.

        - HTTP 400 | Code: 255 | Message : Error requesting all zones.

        - HTTP 400 | Code: 256 | Message : Error requesting all reservations.

        - HTTP 400 | Code: 257 | Message : The date is not in the right format.

        - HTTP 400 | Code: 306 | Message : Date range invalid, start date should be before end date.

        - HTTP 400 | Code: 260 | Message : Requested statistics are not valid, PERCENTILES_DURATION must not be mixed with other element statistics neither with monitor statistic.

        - HTTP 400 | Code: 261 | Message : A test with the same name already exists.

        - HTTP 400 | Code: 262 | Message : Error while processing json body. It is not a valid json.

        - HTTP 400 | Code: 263 | Message : The name property is required.

        - HTTP 400 | Code: 264 | Message : The property lgZones is a bad format.

        - HTTP 404 | Code: 265 | Message : Test not found.

        - HTTP 400 | Code: 266 | Message : Format is mandatory as request parameter.

        - HTTP 400 | Code: 267 | Message : Invalid format in request.

        - HTTP 400 | Code: 268 | Message : This name is already used for a scenario in the project.

        - HTTP 400 | Code: 270 | Message : Fail to move to Workspace and attach to a Test because Test not in destination Workspace.

        - HTTP 400 | Code: 271 | Message : Fail to move to Workspace and attach to a Test.

        - HTTP 400 | Code: 272 | Message : The Test Result has been successfully moved to the specified Workspace and Test but other fields update failed.

        - HTTP 400 | Code: 275 | Message : Unknown stopPolicy value. Allowed are TERMINATE or GRACEFUL.

        - HTTP 400 | Code: 276 | Message : Error stopping the test.

        - HTTP 400 | Code: 277 | Message : Error stopping the test. The test is not running.

        - HTTP 400 | Code: 278 | Message : Zone does not exist.

        - HTTP 400 | Code: 279 | Message : Error starting the test.

        - HTTP 400 | Code: 280 | Message : The workspace id is mandatory.

        - HTTP 400 | Code: 281 | Message : The workspace name can''t be empty.

        - HTTP 400 | Code: 282 | Message : The workspace name already exist.

        - HTTP 400 | Code: 283 | Message : Can not delete default workspace.

        - HTTP 400 | Code: 284 | Message : The workspace can not be deleted : One or more tests are running.

        - HTTP 400 | Code: 285 | Message : Login(s) don''t exist : ${loginList}

        - HTTP 400 | Code: 286 | Message : Workspace id and name do not match, not proceeding.

        - HTTP 400 | Code: 287 | Message : Workspace is public (allUsersEnabled) : can not specify members.

        - HTTP 404 | Code: 288 | Message : The workspace does not exist.

        - HTTP 404 | Code: 289 | Message : No data found.

        - HTTP 400 | Code: 290 | Message : This user is still in the LDAP, to remove it from NLWeb, remove it from the LDAP. No need to call this endpoint.

        - HTTP 404 | Code: 291 | Message : This user does not exist.

        - HTTP 400 | Code: 292 | Message : This option is only allowed in NLWeb SaaS.

        - HTTP 400 | Code: 293 | Message : User self-deletion is forbidden.

        - HTTP 400 | Code: 294 | Message : Only allowed for users with Account Administrator roles (SaaS only role).

        - HTTP 400 | Code: 295 | Message : User "admin" cannot be deleted.

        - HTTP 400 | error: FILE_ID_NOT_FOUND | Message : File ID not found.

        - HTTP 400 | error: FILE_CANCELED | Message : Upload for file ID has been canceled.

        - HTTP 400 | error: INVALID_FILE_STATUS | Message : File status is invalid.

