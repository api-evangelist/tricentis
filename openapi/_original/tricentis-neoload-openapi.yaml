- NeoloadAuthorizer: []
components:
  parameters:
    workspace-id:
      name: workspaceId
      in: path
      required: true
      description: Unique identifier representing a Workspace.
      schema: {type: string}
    result-id:
      name: resultId
      in: path
      required: true
      description: Unique identifier representing a specific Test Result.
      schema: {type: string}
    result-format:
      name: format
      in: query
      required: true
      schema:
        type: string
        enum: [CSV, JSON]
        default: CSV
      description: The format of the Test Result data.
    usage-format:
      name: format
      in: query
      required: true
      schema:
        type: string
        enum: [JSON, CSV]
        default: JSON
      description: The format of the Usage data.
    element_id:
      name: elementId
      in: path
      required: true
      description: Unique identifier representing a specific element.
      schema: {type: string}
    counter_id:
      name: counterId
      in: path
      required: true
      description: Unique identifier representing a specific counter.
      schema: {type: string}
    test-id:
      name: testId
      in: path
      required: true
      description: Unique identifier representing a specific test.
      schema: {type: string}
    event_types:
      name: types
      in: query
      required: false
      style: form
      explode: false
      description: |
        The types of the events you expect to get. It will return all the types if the field is left empty. (Ctrl+click to select multiple values)
      schema:
        type: array
        items: {$ref: '#/components/schemas/EventType'}
    usage_event_group:
      name: groups
      in: query
      required: false
      style: form
      explode: false
      description: |
        The types of the usage data you expect to get. It will return all the types if the field is left empty. (Ctrl+click to select multiple values)
      schema:
        type: array
        items: {$ref: '#/components/schemas/UsageEventGroup'}
    usage_event_sub_group:
      name: subGroups
      in: query
      required: false
      style: form
      explode: false
      description: |
        The sub types of the usage data you expect to get. It will return all the types if the field is left empty. (Ctrl+click to select multiple values)
      schema:
        type: array
        items: {$ref: '#/components/schemas/UsageEventSubGroup'}
    page_limit:
      name: limit
      in: query
      required: false
      description: The maximum number of elements returned by this call. The maximum
        must be less than or equal to 200.
      schema: {type: integer, maximum: 200, default: 50}
    usage_page_limit:
      name: limit
      in: query
      required: false
      description: The maximum number of elements returned by this call.
      schema: {type: integer, default: 0}
    page_offset:
      name: offset
      in: query
      required: false
      description: The offset of the first element to return. Starting at this offset,
        the query will return a maximum of 'limit' elements.
      schema: {type: integer, default: 0}
    single_sort:
      name: sort
      in: query
      required: false
      description: The key to sort the elements on. It may begin with a '+' or a '-'
        to specify an ascending or descending sort order. The list of available keys
        can be found in the endpoint description.
      schema: {type: string}
    multi_sort:
      name: sort
      in: query
      required: false
      description: Comma-separated list of keys to sort the elements on. Each key
        may begin with a '+' or a '-' to specify an ascending or descending sort order.
        The list of available keys can be found in the endpoint description.
      schema: {type: string}
    sla_status:
      name: status
      in: query
      schema:
        type: string
        enum: [PASSED, WARNING, FAILED]
      description: The status of the element you expect to get the SLA for. It will
        return all the statuses if the field is left empty.
    sla_category:
      name: category
      in: query
      schema:
        type: string
        enum: [TRANSACTION, ACTION, PAGE, REQUEST]
      description: The category of the element you expect to get the SLA for. It will
        return all the categories if the field is left empty.
    from_date_time:
      name: fromDateTime
      in: query
      required: false
      description: Date-time with an offset of the beginning of the search. Format
        YYYY-MM-DDTHH:mm:ssZ<br/> Example 2020-01-01T09:00:00+00:00
      schema: {type: string}
    to_date_time:
      name: toDateTime
      in: query
      required: false
      description: Date-time with an offset of the end of the search. Format YYYY-MM-DDTHH:mm:ssZ<br/>
        Example 2020-01-01T09:00:00+00:00
      schema: {type: string}
    event-id:
      name: eventId
      in: path
      required: true
      description: Unique identifier representing a specific Test Result event.
      schema: {type: string}
  responses:
    success_202:
      description: The request has been processed, but no changes have been made due
