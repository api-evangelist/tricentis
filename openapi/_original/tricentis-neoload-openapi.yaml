    PostCustomEventError:
      type: object
      properties:
        code: {type: integer, example: 404}
        message: {type: string, example: Event start timestamp is after the bench
            end timestamp. Make sure the timestamp is in seconds.}
      description: |
        - HTTP 400 | Code: 400 | Message : Error while parsing json body for custom event.
        - HTTP 400 | Code: 401 | Message : Bench did not start yet.
        - HTTP 400 | Code: 402 | Message : Event start timestamp is before bench start timestamp.
        - HTTP 400 | Code: 403 | Message : Event start timestamp is in the future. Make sure the timestamp is in seconds.
        - HTTP 400 | Code: 404 | Message : Event start timestamp is after the bench end timestamp. Make sure the timestamp is in seconds.
        - HTTP 400 | Code: 405 | Message : Event end timestamp is before the event start timestamp.
        - HTTP 400 | Code: 406 | Message : Event end timestamp is in the future. Make sure the timestamp is in seconds.
        - HTTP 400 | Code: 407 | Message : Event end timestamp is after the bench end timestamp. Make sure the timestamp is in seconds.
        - HTTP 400 | Code: 408 | Message : Event with INSTANT timeframe cannot have a end timestamp.
        - HTTP 400 | Code: 409 | Message : Event name is empty.
        - HTTP 400 | Code: 410 | Message : Event name is too long.
        - HTTP 400 | Code: 411 | Message : Event code is too long.
        - HTTP 400 | Code: 412 | Message : Event source is too long.
        - HTTP 400 | Code: 413 | Message : Event description is too long.
        - HTTP 400 | Code: 414 | Message : Event url is too long.
        - HTTP 400 | Code: 415 | Message : Max count of custom event reached.
    PatchCustomEventError_400:
      type: object
      properties:
        code: {type: integer, example: 404}
        message: {type: string, example: Event end timestamp is after the bench end
            timestamp. Make sure the timestamp is in seconds.}
      description: |
        - HTTP 400 | Code: 400 | Message : Error while parsing json body for custom event.
        - HTTP 400 | Code: 405 | Message : Event end timestamp is before the event start timestamp.
        - HTTP 400 | Code: 406 | Message : Event end timestamp is in the future. Make sure the timestamp is in seconds.
        - HTTP 400 | Code: 407 | Message : Event end timestamp is after the bench end timestamp. Make sure the timestamp is in seconds.
        - HTTP 400 | Code: 413 | Message : Event description is too long.
        - HTTP 400 | Code: 414 | Message : Event url is too long.
    PatchCustomEventError_404:
      type: object
      properties:
        code: {type: integer, example: 417}
        message: {type: string, example: Event with this eventId cannot be found for
            this bench.}
      description: |
        - HTTP 404 | Code: 417 | Message : Event with this eventId cannot be found for this bench.
