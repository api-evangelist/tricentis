      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    error_404:
      description: Resource not found. Please verify the parameters and try again.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    error_413:
      description: Request entity too large.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    error_429:
      description: Too many requests. Your maximum number of requests per minute is
        reached. Try again soon.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RateLimitError'}
    error_500:
      description: Internal server error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    error_501:
      description: Not Implemented
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
