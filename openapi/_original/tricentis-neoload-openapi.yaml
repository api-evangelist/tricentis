    TestResultRasterConfiguration:
      type: object
      properties:
        width: {type: integer, format: int32, description: The width of the generated
            graph., example: 600}
        height: {type: integer, format: int32, description: The height of the generated
            graph., example: 200}
        title: {type: string, description: The main title of the generated graph.,
          example: My Test}
        rasterType:
          type: string
          enum: [PNG, JPEG]
          description: The type of the generated graph. Can be PNG or JPEG. Default
            is PNG.
          example: PNG
        xAxisLabel: {type: string, description: The xAxis label of the generated graph.,
          example: X Axis}
        yAxisLabel: {type: string, description: The yAxis label of the generated graph.,
          example: Y Axis}
        legend: {type: boolean, description: If true the legend is displayed. Default
            is true., example: true}
        multiYAxis: {type: boolean, description: 'If true, display one axis per serie.
            Default is false.', example: true}
        theme:
          type: string
          enum: [DARK, LIGHT, TRANSPARENT]
          description: The theme of the graph. Default is TRANSPARENT.
          example: DARK
        elementIds:
          type: array
          description: The list of elements.
          items: {$ref: '#/components/schemas/ElementIdDefinition'}
          example:
          - id: all-requests
            statistics: [AVG_DURATION]
        counterIds:
          type: array
          description: The list of counters.
          items: {type: string}
          example: [a4bed45a-06b2-48e1-94fd-3ea979e4f360, b5be82ff-3563-4812-93a5-4ea888e4e254]
    TestResultRasterMultiConfiguration:
      type: object
      properties:
        width: {type: integer, format: int32, description: The width of the generated
            graph., example: 600}
        height: {type: integer, format: int32, description: The height of the generated
            graph., example: 200}
        title: {type: string, description: The main title of the generated graph.,
          example: My Test}
        rasterType:
          type: string
          enum: [PNG, JPEG]
          description: The type of the generated graph. Can be PNG or JPEG. Default
            is PNG.
          example: PNG
        xAxisLabel: {type: string, description: The xAxis label of the generated graph.,
          example: X Axis}
        yAxisLabel: {type: string, description: The yAxis label of the generated graph.,
          example: Y Axis}
        legend: {type: boolean, description: If true the legend is displayed. Default
            is true., example: true}
        multiYAxis: {type: boolean, description: 'If true, display one axis per serie.
            Default is false.', example: true}
        theme:
          type: string
          enum: [DARK, LIGHT, TRANSPARENT]
          description: The theme of the graph. Default is TRANSPARENT.
          example: DARK
        resultIds:
          type: object
          additionalProperties: {$ref: '#/components/schemas/TestResultIdDefinition'}
          example:
            d30fdcc2-319e-4be5-818e-f1978907a3ce:
              elementIds:
              - id: all-requests
                statistics: [AVG_DURATION]
              - id: b8bfc48e-b7ed-48f8-b5ea-404d3faf15cb
                statistics: [AVG_DURATION, ELEMENTS_PER_SECOND]
            dbe589d4-a10c-48d1-999e-da1fafa5df28:
              elementIds:
              - id: all-requests
                statistics: [AVG_DURATION]
              counterIds: [a4bed45a-06b2-48e1-94fd-3ea979e4f360, b5be82ff-3563-4812-93a5-4ea888e4e254]
    TestResultIdDefinition:
      type: object
      description: The map of Test Result ids with their own statistics and counters
        definition.
      properties:
        elementIds:
          type: array
          description: The list of elements.
          items: {$ref: '#/components/schemas/ElementIdDefinition'}
        counterIds:
          type: array
          description: The list of counters.
          items: {type: string}
    ElementIdDefinition:
      type: object
      properties:
        id: {type: string, description: 'The id of the element. Can be a specific
            element identifier or one of the following keywords: - all-requests -
            all-pages - all-transactions', example: a6f2f595-7b62-4dc4-9368-a1cf670cd924}
        statistics:
          type: array
          items:
            type: string
            enum: [AVG_DURATION, MIN_DURATION, MAX_DURATION, COUNT, THROUGHPUT, ELEMENTS_PER_SECOND,
              ERRORS, ERRORS_PER_SECOND, ERROR_RATE, AVG_TTFB, MIN_TTFB, MAX_TTFB,
              PERCENTILES_DURATION]
            description: |
              Comma-separated list of statistics to get.

              Available statistics are:
              - AVG_DURATION (ms)
              - MIN_DURATION (ms)
              - MAX_DURATION (ms)
              - COUNT
              - THROUGHPUT (Byte/s)
              - ELEMENTS_PER_SECOND
              - ERRORS
              - ERRORS_PER_SECOND
              - ERROR_RATE (%)
              - AVG_TTFB (ms)
              - MIN_TTFB (ms)
              - MAX_TTFB (ms)
              - PERCENTILES_DURATION (ms)

              Warning: PERCENTILES_DURATION cannot be mixed with other statistics.
            example: [AVG_DURATION, ELEMENTS_PER_SECOND]
