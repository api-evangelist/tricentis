      type: object
      properties:
        lastAction:
          type: string
          description: Last action performed on the Workspace.
          example: CREATE
          enum: [CREATE, UPDATE, DELETE]
        lastUpdateDate: {type: integer, description: 'Timestamp when the Workspace
            was updated for the last time. Number of seconds since January 1, 1970.',
          format: int64, example: 1582550442}
      description: Workspace last change
    MemberDefinition:
      type: object
      properties:
        firstName: {type: string, description: User first name}
        lastName: {type: string, description: User last name}
