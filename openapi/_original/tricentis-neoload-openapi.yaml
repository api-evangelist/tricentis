        '404': {$ref: '#/components/responses/error_404'}
        '429': {$ref: '#/components/responses/error_429'}
        '500': {$ref: '#/components/responses/error_500'}
    post:
      operationId: PostTestResultMonitors
      summary: Create custom monitors
      description: |
        Pushes monitoring data (external data) for a given running test. <br/><br/>
        <b>Resolution limitation</b>: <ul>
          <li>Maximum resolution for a monitor value is <b>1 per second</b>, otherwise <b>the first value is kept</b>.</li>
        </ul>
        <b>Maximum paths and monitors</b>: <ul>
          <li>Maximum 100 different <b>unique</b> paths.</li>
          <li>Maximum 50 different monitors for a given path.</li>
          <li>Maximum length is 10 for a path.</li>
        </ul>
        <b>Other requirements</b>: <ul>
          <li>'/' character is not allowed in path element.</li>
          <li>The test must be <b>running</b> while pushing the data.</li>
          <li>For a given timestamp, all monitors relative to a path must be sent in the same request.</li>
          <li>These elements must not be empty: <b>monitor name</b>, <b>a path element</b> and <b>values</b>.</li>
        </ul>
      tags: [Results|Monitors]
      parameters:
      - {$ref: '#/components/parameters/workspace-id'}
      - {$ref: '#/components/parameters/result-id'}
      responses:
        '201': {description: Created}
        '400': {$ref: '#/components/responses/error_400'}
        '401': {$ref: '#/components/responses/error_401'}
        '403': {$ref: '#/components/responses/error_403'}
        '404': {$ref: '#/components/responses/error_404'}
        '413': {$ref: '#/components/responses/error_413'}
        '429': {$ref: '#/components/responses/error_429'}
        '500': {$ref: '#/components/responses/error_500'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MonitorPostRequest'}
        description: List of custom monitors
        required: true
