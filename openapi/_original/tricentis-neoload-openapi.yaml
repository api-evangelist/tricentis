        loadInjectionProvider: {$ref: '#/components/schemas/LoadInjectionProvider'}
    GetTestDefinition:
      allOf:
      - {$ref: '#/components/schemas/TestDefinition'}
      - type: object
        properties:
          scenario:
            description: Custom scenario from the test, additional info on as-code
              scenario can be found on http://www.neotys.com/redirect/redirect.php?target=doc-yaml-scenario
            type: object
            required: [name, populations]
            properties:
              name: {type: string, description: 'Unique name/identifier of the scenario,
                  identical to the name of the test.', example: New Test 1}
              store_variables_for_raw_data: {type: boolean, default: false, description: This
                  option allows storing variables for raw data.}
              populations:
                type: array
                description: The list of runtime settings per population
                items:
                  oneOf:
                  - type: object
                    required: [name, rampup_load]
                    properties:
                      name: {type: string, description: The name of the population
                          from NeoLoad project., example: populationRampup}
                      rampup_load:
                        type: object
                        description: A load that generates a number of Virtual Users
                          that increases throughout the test. Useful for checking
                          the server behavior under an increasing load.
                        required: [min_users, max_users, increment_users, increment_every,
                          duration]
                        properties:
                          min_users: {type: number, description: The initial number
                              of Virtual Users., example: 2}
                          max_users: {type: number, description: The maximum number
                              of Virtual Users., example: 10}
                          increment_users: {type: number, description: The number
                              of Virtual Users to increment., example: 2}
                          increment_every: {type: string, description: 'The incrementation
                              frequency: time length (XhXmXs) or number of iterations
                              (X iteration or X iterations).', example: 1m}
                          duration: {type: string, description: 'The duration of the
                              load policy: time length (XhXmXs) or number of iterations
                              (X iteration or X iterations).', example: 4m30s}
                          increment_rampup: {type: string, description: 'Define how
                              Virtual Users should be started: simultaneously or with
                              a preset delay (XhXmXs). This rule is used each time
                              new Virtual Users are created, at each load increase
                              for a ramp-up load policy.', example: 30s}
                  - type: object
                    required: [name, constant_load]
                    properties:
                      name: {type: string, description: The name of the population
                          from NeoLoad project., example: populationConstant}
                      constant_load:
                        type: object
                        description: A load that generates a fixed number of Virtual
                          Users.
                        required: [users, duration]
                        properties:
                          users: {type: number, description: The fixed number of Virtual
                              Users., example: 10}
                          duration: {type: string, description: 'The duration of the
                              load policy: time length (XhXmXs) or number of iterations
                              (X iteration or X iterations).', example: 1h}
                          rampup: {type: string, description: 'Define how Virtual
                              Users should be started: simultaneously or with a preset
                              delay (XhXmXs).', example: 10m}
    TestResultDefinition:
      type: object
      properties:
        id: {type: string, description: Unique identifier of the Test Result.}
        name: {type: string, description: Name of the Test Result.}
        description: {type: string, description: Description of the Test Result.}
        author: {type: string, description: First and Last name of the person who
            launched the test.}
        terminationReason:
          type: string
          enum: [POLICY, VARIABLE, MANUAL, LG_AVAILABILITY, LICENSE, FAILED_TO_START,
            CANCELLED, RESERVATION_ENDED, UNKNOWN]
          description: Reason that caused the test to end.
        lgCount: {type: integer, description: Total number of Load Generators used
            in the Test Result.}
        project: {type: string, description: Name of the project.}
        scenario: {type: string, description: Name of the scenario.}
        status:
          type: string
          enum: [INIT, STARTING, RUNNING, TERMINATED, UNKNOWN]
          description: Status of the Test Result.
        qualityStatus:
          type: string
          enum: [PASSED, FAILED, COMPUTING, UNKNOWN]
          description: Quality status of the Test Result.
        startDate: {type: integer, format: int64, description: Timestamp when the
            test started.}
        endDate: {type: integer, format: int64, description: Timestamp when the test
            ended.}
        duration: {type: integer, format: int64, description: Test duration in seconds.}
        testId: {type: string, description: Unique identifier of the test., example: 5ed5350f-9f2f-4e2a-9acb-cdbcee874256}
        externalUrl: {type: string, description: 'Optional URL to an external system,
            for example the CI job''s link.', example: 'https://dev.azure.com/myorg/myproject/_build?definitionId=123'}
        externalUrlLabel: {type: string, description: 'Optional label to describe
            the external URL, for example the CI name or job ID.', example: AzureDevOps#123}
        isLocked: {type: boolean, description: Locks a Test Result (avoid automatic
            deletion).}
    TestResultStopRequest:
      type: object
      properties:
        stopPolicy:
          type: string
          enum: [GRACEFUL, TERMINATE]
          description: How to stop the Test Result. Default is GRACEFUL.<ul><li>GRACEFUL
            stops gently the Test Result.</li><li>TERMINATE terminates the Test Result
            (kill it).</li></ul>
          example: GRACEFUL
    TestResultLogs:
      type: object
      properties:
        content: {type: string, description: The content of the log.}
        timestamp: {type: integer, format: int64, description: The timestamp (GMT+0)
            in millisecond of the operation described by the content.}
        type: {type: string, description: The source of the log line.}
    TestResultUpdateRequest:
      type: object
      properties:
        name: {type: string, description: Name of the Test Result.}
        description: {type: string, description: Description of the Test Result.}
        qualityStatus:
          type: string
          enum: [PASSED, FAILED]
          description: Quality status of the Test Result.
        externalUrl: {type: string, description: 'Optional URL to an external system,
            for example the CI job''s link.'}
        externalUrlLabel: {type: string, description: 'Optional label to describe
            the external URL, for example the CI name or job ID.'}
        isLocked: {type: boolean, description: Locks a Test Result (avoid automatic
            deletion).}
        workspaceId: {type: string, description: 'Workspace of the Test Result. WARNING
            ! When moving a Test Result to another Workspace, all the dashboards data
            linked to the selected Test Results will be deleted! Running Test Results
            will not be moved.'}
        testId: {type: string, description: Test of the Test Result.}
    SwitchReservationPostRequest:
      type: object
      properties:
        enabled: {type: boolean}
    MonitorPostRequest:
      type: object
      properties:
        monitors:
          type: array
          items: {$ref: '#/components/schemas/CustomMonitor'}
    TestResultStatistics:
      type: object
      properties:
        totalRequestCountSuccess: {type: integer, format: int64, description: Total
            number of requests in the scenario that did not encounter any error.}
        totalRequestCountFailure: {type: integer, format: int64, description: Total
            number of requests in the scenario that encountered errors.}
        totalRequestDurationAverage: {type: number, format: float, description: Average
            time in seconds for all requests of the scenario to be performed (from
            first byte sent to last byte received).}
        totalRequestCountPerSecond: {type: number, format: float, description: Total
            number of requests in the scenario that are performed per second.}
        totalTransactionCountSuccess: {type: integer, format: int64, description: Total
            number of the scenario Transactions executed without encountering any
            error.}
        totalTransactionCountFailure: {type: integer, format: int64, description: Total
            number of the scenario Transactions executed with errors.}
        totalTransactionDurationAverage: {type: number, format: float, description: Average
            time in seconds for all Transactions of the scenario to be executed.}
        totalTransactionCountPerSecond: {type: number, format: float, description: Total
            number of the scenario Transactions executed per second.}
        totalIterationCountSuccess: {type: integer, format: int64, description: Total
            number of times when the 'Actions' Container was run for each Virtual
            User without encountering any error.}
        totalIterationCountFailure: {type: integer, format: int64, description: Total
            number of times when the 'Actions' Container was run for each Virtual
            User and encountered an error.}
        totalGlobalDownloadedBytes: {type: integer, format: int64, description: Total
            size of http traffic received in bytes.}
        totalGlobalDownloadedBytesPerSecond: {type: number, format: float, description: Average
            size of http traffic received in bytes per second.}
        totalGlobalCountFailure: {type: integer, format: int64, description: ''}
        lastRequestCountPerSecond: {type: number, format: float, description: Last
            value received for the number of requests in the scenario that are performed
            per second.}
        lastTransactionDurationAverage: {type: number, format: float, description: Last
            value received for the average time in milliseconds for all Transactions
            of the scenario.}
        lastVirtualUserCount: {type: integer, format: int32, description: Last value
            received for the total number of Virtual Users executed in the test.}
