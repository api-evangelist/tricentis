            the reservation begins. Number of seconds since January 1, 1970.'}
        endDateTime: {type: number, format: int64, description: 'Timestamp when the
            reservation ends. Number of seconds since January 1, 1970.'}
        reservationWebVUs: {type: number, format: int32, description: The number of
            Web Virtual Users to be reserved.}
        reservationSAPVUs: {type: number, format: int32, description: The number of
            SAP Virtual Users to be reserved.}
        controllerZoneId: {type: string, example: hIugt, description: Name of the
            zone.}
        neoloadVersion: {type: string, example: 7.0.2-20191110-1, description: Neoload
            version of the selected controller.}
        lgZonesResourcesReservation:
          type: array
          items: {$ref: '#/components/schemas/LgByZones'}
        author: {type: string, description: Name of the user who created the reservation.}
        workspaceId: {type: string, example: 5e3acde2e860a132744ca916, description: Unique
            identifier representing a Workspace.}
        name: {type: string, description: Title of the reservation.}
        description: {type: string, description: Description of the reservation.}
        type:
          type: string
          description: How the reservation has been created. By a user or automatically
            when a test started.
          enum: [SCHEDULED, AUTO_RESERVATION]
    LgByZones:
      type: object
      description: The number of load generators reserved for a specific zone.
      properties:
        zoneId: {type: string, example: hIugt, description: The unique identifier
            of a zone.}
        value: {type: number, example: 10, description: The number of load generators.}
    WorkspaceDefinitionList:
      type: array
      items: {$ref: '#/components/schemas/WorkspaceDefinition'}
    WorkspaceDefinition:
      type: object
      properties:
        id: {type: string, example: 5e3acde2e860a132744ca916, description: Unique
            identifier of the Workspace.}
        name: {type: string, description: Name of the Workspace., example: Default
            Workspace}
        description: {type: string, description: Description of the Workspace., example: Workspace
            description}
        lastChange: {type: object, $ref: '#/components/schemas/LastChangeDefinition'}
    InformationDefinition:
      type: object
      properties:
        front_url: {type: string, example: 'https://preprod-neoload.saas.neotys.com',
          description: 'Root URL where the NeoloadWeb application can be accessed,
            used to reconstruct relative URLs.'}
        filestorage_url: {type: string, example: 'https://preprod-neoload-files.saas.neotys.com',
          description: URL for Neoload projects file upload and management.}
        version: {type: string, example: SaaS, description: NeoloadWeb platform version.
            Will be "SaaS" for official NeoLoad SaaS platform.}
    PostCustomEventRequest:
      type: object
      properties:
        startTimestamp: {type: number, example: 1600000000, description: 'Custom event
            start epoch timestamp in seconds. If not provided, current time is used.'}
        endTimestamp: {type: number, example: 1600000000, description: 'Custom event
            end epoch timestamp in seconds. If not provided, then either startTimestamp
            is used (when timeframe is INSTANT), or Test Result end timestamp is used
            (when timeframe is TIME_RANGE).'}
        timeframe:
          type: string
          enum: [TIME_RANGE, INSTANT]
          default: TIME_RANGE
        fullname: {type: string, example: myCustomEvent, description: Custom event
            name. Max length 256 chars.}
        code: {type: string, example: Application Error, description: Custom event
            code. Max length 64 chars.}
        source: {type: string, example: APM, description: 'Custom event source. Max
            length 32 chars. If not set, source is set to ''External''.'}
        description: {type: string, description: Custom event description. Max length
            2048 chars.}
        url: {type: string, description: Custom event URL. Max length 2048 chars.}
      required: [fullname]
    Usage:
      description: An array of object representing audit events.
      type: array
      items: {type: object}
    PostCustomEventResponse:
      type: object
      properties:
        id: {type: string, description: The unique ID of the custom event created.}
        offset: {type: number, example: 1000, description: 'Custom event start timestamp
            in milliseconds, relative to bench start timestamp.'}
        duration: {type: number, example: 1000, description: Custom event duration
            in milliseconds.}
        timeframe:
          type: string
          enum: [TIME_RANGE, INSTANT]
          default: TIME_RANGE
        fullname: {type: string, example: myCustomEvent, description: Custom event
            name. Max length 256 chars.}
        code: {type: string, example: Application Error, description: Custom event
            code. Max length 64 chars.}
        source: {type: string, example: APM, description: Custom event source. Max
            length 32 chars.}
        description: {type: string, description: Custom event description. Max length
            512 chars.}
        url: {type: string, description: Custom event URL. Max length 2048 chars.}
    PatchCustomEventRequest:
      type: object
      properties:
        endTimestamp: {type: number, example: 1600000000, description: Custom event
            end epoch timestamp in seconds.}
        description: {type: string, description: Custom event description. Max length
            2048 chars.}
        url: {type: string, description: Custom event URL. Max length 2048 chars.}
      required: [id]
    PatchCustomEventResponse:
      type: object
      properties:
        id: {type: string, description: The unique ID of the custom event patched.}
        offset: {type: number, example: 1000, description: 'Custom event start timestamp
            in milliseconds, relative to bench start timestamp.'}
        duration: {type: number, example: 1000, description: Custom event duration
            in milliseconds.}
        timeframe:
          type: string
          enum: [TIME_RANGE, INSTANT]
          default: TIME_RANGE
        fullname: {type: string, example: myCustomEvent, description: Custom event
            name. Max length 256 chars.}
        code: {type: string, example: Application Error, description: Custom event
            code. Max length 64 chars.}
        source: {type: string, example: APM, description: Custom event source. Max
            length 32 chars.}
        description: {type: string, description: Custom event description. Max length
            512 chars.}
        url: {type: string, description: Custom event URL. Max length 2048 chars.}
    BenchDeletionFilter:
      type: object
      description: filter to select element for deletion.
      example: {resultNamePattern: toRemove.*}
      oneOf:
      - {$ref: '#/components/schemas/BenchDeletionFilterByProject'}
      - {$ref: '#/components/schemas/BenchDeletionFilterByTestDto'}
      - {$ref: '#/components/schemas/BenchDeletionFilterByResultName'}
    BenchDeletionFilterByProject:
      type: object
      properties:
        projectName: {type: string}
        scenarioName: {type: string}
    BenchDeletionFilterByResultName:
      type: object
      properties:
        resultNamePattern: {type: string}
    BenchDeletionFilterByTestDto:
      type: object
      properties:
        testSettingsId: {type: string, example: '{"testSettingsId: d6385e46-353b-409f-a494-7ca892edeaa6"}'}
    BenchDeletionPolicyApiFullRequestDto:
      type: object
      properties:
        deletionFilter: {$ref: '#/components/schemas/BenchDeletionFilter'}
        deletionSetting: {$ref: '#/components/schemas/BenchDeletionSetting'}
    BenchDeletionPolicyApiResponseDto:
      type: object
      properties:
        deletionFilter: {$ref: '#/components/schemas/BenchDeletionFilter'}
        deletionSetting: {$ref: '#/components/schemas/BenchDeletionSetting'}
        id: {type: string}
        lastModifiedDate: {type: string, format: date-time}
        lastModifiedUserName: {type: string}
        workspaceId: {type: string}
    BenchDeletionPolicyApiUpdateRequestDto:
      type: object
      properties:
        deletionFilter: {$ref: '#/components/schemas/BenchDeletionFilter'}
        deletionSetting: {$ref: '#/components/schemas/BenchDeletionSetting'}
    BenchDeletionSetting:
      type: object
      description: Delete by time or number
      example: {retentionCount: 5}
      oneOf:
      - {$ref: '#/components/schemas/BenchDeletionSettingCount'}
      - {$ref: '#/components/schemas/BenchDeletionSettingDurationDto'}
    BenchDeletionSettingCount:
      type: object
      properties:
        retentionCount: {type: integer, format: int32}
    BenchDeletionSettingDurationDto:
      type: object
      properties:
        retentionDays: {type: integer, description: number of days before deletion,
          format: int32}
    DynamicInfrastructureProviderApiResponseDto:
      type: object
      properties:
        agentId: {type: string}
        connectionType:
          type: string
          enum: [CLIENT_BASED, AGENT_BASED]
        id: {type: string}
        name: {type: string}
        parameters:
          type: object
          additionalProperties: {type: string, description: parameters applied to
              provider., example: '{"K8S_API_END_POINT":"https://example/api","K8S_NAMESPACE":"kubernetes-namespace","K8S_LABELS":"","K8S_ANNOTATIONS":"","K8S_NODE_SELECTORS":""}'}
          description: parameters applied to provider.
          example: {K8S_API_END_POINT: 'https://example/api', K8S_NAMESPACE: kubernetes-namespace,
            K8S_LABELS: '', K8S_ANNOTATIONS: '', K8S_NODE_SELECTORS: ''}
        type:
          type: string
          enum: [AWS, GCE, AZURE, KUBERNETES, OPEN_SHIFT, DOCKER_ENGINE, DOCKER_SWARM,
            NCP]
    FullWorkspaceDefinition:
      type: object
      properties:
        allUsersEnabled: {type: boolean, description: True if all users of the Workspace
            are enabled}
        description: {type: string, description: Description of the Workspace, example: Workspace
            description}
        id: {type: string, description: Unique identifier of the Workspace, example: 5e3acde2e860a132744ca916}
        lastChange: {$ref: '#/components/schemas/LastChangeDefinition'}
        members:
          uniqueItems: true
          type: array
          description: Members assigned to Workspace
          items: {$ref: '#/components/schemas/MemberDefinition'}
        name: {type: string, description: Name of the Workspace, example: Default
            Workspace}
        vuQuota: {$ref: '#/components/schemas/WorkspaceVuQuotaDefinition'}
