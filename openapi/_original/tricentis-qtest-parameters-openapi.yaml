            type: object
            properties:
              offset:
                type: number
                example: 1
              limit:
                type: number
                example: 50
              total_items:
                type: number
                example: 120
              total_pages:
                type: number
                example: 3
              items:
                type: array
                items:
                  $ref: "#/definitions/DatasetModel"
        400:
          description: "Bad Request"
          schema:
            type: object
            properties:
              error:
                type: string
        401:
          description: "Unauthorized"
          schema:
            type: object
            properties:
              error:
                type: string
        500:
          description: "Internal Server Error"
          schema:
            type: object
            properties:
              error:
                type: string
  /api/v1/data-sets/bulk-delete:
    post:
      description: Delete multiple datasets
      tags:
        - Datasets
      parameters:
        - name: body
          in: body
          required: true
          description: List of dataset ids that need to be deleted
          schema:
            type: array
            items:
              type: string
              example: 5a17c935b015841767bbec66
      produces:
        - application/json
      responses:
        200:
          description: "Success"
          schema:
            type: object
            properties:
              deleted:
                type: number
                description: number of datasets being deleted
                example: 1
              skipped:
                type: array
                description: dataset ids being skipped or empty []
                items:
                  type: string
        400:
          description: "Bad Request"
          schema:
            type: object
            properties:
              error:
                type: string
        401:
          description: "Unauthorized"
          schema:
            type: object
            properties:
              error:
                type: string
        500:
          description: "Internal Server Error"
          schema:
            type: object
            properties:
              error:
                type: string
  /api/v1/data-sets/status:
    put:
      description: Update status of mulitple datasets speficied by dataset ids
      tags:
        - Datasets
      parameters:
        - name: body
          in: body
          required: true
          description: List of dataset ids whose status is going to be updated
          schema:
            type: object
            required:
              - status
              - ids
            properties:
              status:
                type: string
                enum:
                  - Active
                  - Inactive
              ids:
                type: array
                items:
                  type: string
                  example: 5a17c935b015841767bbec66
      produces:
        - application/json
      responses:
        200:
          description: "Dataset status has been successfully updated"
          schema:
            type: object
            properties:
              updated:
                type: number
                description: Number of datasets updated with new status
                example: 1
              skipped:
                type: array
                description: Datasets ids being skipped status update or empty []
                items:
                  type: string
        400:
          description: "Bad Request"
          schema:
            type: object
            properties:
              error:
                type: string
        401:
          description: "Unauthorized"
          schema:
            type: object
            properties:
              error:
                type: string
        500:
          description: "Internal Server Error"
          schema:
            type: object
            properties:
              error:
                type: string
  /api/v1/data-sets/import:
    post:
      description: Import dataset(s) from excel file. The result is an import task id that the caller can poll to check for the importing progress/result
      tags:
        - Datasets
      parameters:
        - name: file
          in: formData
          type: file
          required: true
          description: Excel file containg datasets to be imported
        - name: config
          in: formData
          type: string
          required: true
          description: Import options {"skipNotActiveParameters":true/false,"projects":[]}
      consumes:
        - multipart/form-data
      produces:
        - application/json
      responses:
        200:
          description: "Import task successfully created"
          schema:
            type: object
            properties:
              id:
                type: string
        400:
          description: "Bad Request"
          schema:
            type: object
            properties:
              error:
