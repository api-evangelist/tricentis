definitions:
  ### Parameter definitions
  ParameterModel:
    type: object
    properties:
      id:
        type: string
        description: parameter id
        example: 5a17c935b015841767bbec64
      identifier:
        type: string
        description: parameter name
        example: Sample Parameter Name
      description:
        type: string
        description: parameter description
        example: Sample Prameter Description
      created:
        type: string
        description: created date in ISODate format
        format: date-time
      modified:
        type: string
        description: modified date in ISODate format
        format: date-time
      status:
        type: string
        description: parameter status active/inactive/archived
        enum:
          - Active
          - Inactive
          - Archived
      project_ids:
        type: array
        description: ids of qTest Manager projects that this parameters belongs to
        items:
          type: number
          example: 62592
      tc_ids:
        type: array
        description: ids of qTest Manager Test Cases that this parameter is used
        items:
          type: string
          example: 364482
      ds_ids:
        type: array
        description: ids of datasets that this parameter is used
        items:
          type: string
          example: 5a17c935b015841767bbec64
  CreateParameterModel:
    type: object
    required:
      - identifier
      - project_ids
    properties:
      identifier:
        type: string
        description: The name of the new parameter. Identifier with special characters are not allowed, except space( ), underscore(_), minus(-), period(.)
        example: Sample Parameter Name
      description:
        type: string
        description: The description of the new parameter
        example: Sample Parameter Description
      status:
        type: string
        description: The parameter status, must be one of the following
        enum:
          - Active
      project_ids:
        type: array
        description: A list of qTest Manager project ids to associate this parameter to. At least one project id is required.
        items:
          type: number
          example: 62592
  UpdateParameterModel:
    type: object
    required:
      - identifier
      - status
      - project_ids
    properties:
      identifier:
        type: string
        description: The name of the new parameter. Identifier with special characters are not allowed, except space( ), underscore(_), minus(-), period(.)
        example: Sample Parameter Name
      description:
        type: string
        description: The description of the new parameter
        example: Sample Parameter Description
      status:
        type: string
        description: The parameter status, must be one of the following
        enum:
          - Active
          - Inactive
      project_ids:
        type: array
        description: A list of qTest Manager project ids to associate this parameter to. At least one project id is required.
        items:
          type: number
          example: 62592
  SearchParameterModel:
    type: object
    properties:
      identifier:
        type: string
        description: the parameter identifier to search for. If specified, system searches for parameters that has identifier containing the keyword, in case insensitive
        example: param
      exactly:
        type: boolean
        default: false
        description: Set this parameter to true to search for parameter identifier in case sensitive
      project_ids:
        type: array
        description: list of project ids to search for parameters that are associated to it. If no project ids is specified, query for parameters associated with any project of this client
        items:
          type: number
          example: 62592
      statuses:
        type: array
        description: If specified, query for parameters having one of the status in the array. If not specified at all (null or undefined), search for parameters having any status
        items:
          type: string
          enum:
            - Active
            - Inactive
            - Archived
      used:
        type: boolean
        description: If specified, query for parameters are being used / not being used by testcases or datasets. If not specified at all (null or undefined), search for all parameters
      offset:
        type: number
        description: page index. If this parameter is omitted or value is not set then first page will be returned
        example: 1
      limit:
        type: number
        description: page size. If this parameter is omitted or value is not set then system returns max 500 parameters
        example: 50
      sort_by:
        type: string
        description: field name to sort. Possible values are identifier | description | status | created. If this parameter is omitted or no field name is specified, system sorts parameters by last created date
        enum:
          - identifier
          - description
          - status
          - created
          - modified
      sort_order:
        type: string
        description: either asc or desc. If this parameter is omitted or no value is specified, or value is not in either asc nor desc, then asc is the default sort order.
        enum:
          - asc
          - desc
      statistic:
        type: boolean
        default: false
        description: Set this parameter to true to get statistics in the response
  UpdateParameterValueModel:
    type: object
    required:
      - order
      - value
    properties:
      order:
        type: number
        description: parameter value order
        example: 0
      value:
        type: string
        description: parameter value
        example: Update Sample Parameter Value
  SearchParameterValueModel:
    type: object
    properties:
      offset:
        type: number
        description: page index. If this parameter is omitted or value is not set then first page will be returned
        example: 1
      limit:
        type: number
        description: page size. If this parameter is omitted or value is not set then system returns max 500 parameters
        example: 50
      sort_order:
        type: string
        description: default sort by value, either asc or desc. If this parameter is omitted or no value is specified, or value is not in either asc nor desc, then asc is the default sort order.
        enum:
          - asc
          - desc
  ParameterValueModel:
    type: object
    properties:
      id:
        type: string
        description: parameter value identifier
        example: 5a17c935b015841767bbec68
      value:
        type: string
        description: parameter value
        example: Sample Parameter Value
      order:
        type: number
        description: value order
        example: 0
      param_id:
        type: string
        description: parameter identifier
        example: 5a17c935b015841767bbec64
  BulkQueryParametersRequestModel:
    type: object
    required:
      - identifiers
    properties:
      identifiers:
        type: array
        description: the parameter identifiers to search for. System searches for parameter identifiers in case insensitive
        items:
          type: string
          example: [Param 1, Param 2, not found param]
      project_ids:
        type: array
        description: list of project ids to search for parameters that are associated to it. If no project ids is specified, query for parameters associated with any project of this client
        items:
          type: number
          example: 62592
      statuses:
        type: array
        description: If specified, query for parameters having one of the status in the array. If not specified at all (null or undefined), search for parameters having any status
        items:
          type: string
          enum:
            - Active
            - Inactive
            - Archived
      used:
        type: boolean
        description: If specified, query for parameters are being used / not being used by testcases or datasets. If not specified at all (null or undefined), search for all parameters
        example: false
      offset:
        type: number
        description: page index. If this parameter is omitted or value is not set then first page will be returned
        example: 1
      limit:
        type: number
        description: page size. If this parameter is omitted or value is not set then system returns max 500 parameters
        example: 50
      sort_by:
        type: string
        description: field name to sort. Possible values are identifier | description | status | created. If this parameter is omitted or no field name is specified, system sorts parameters by last created date
        enum:
          - identifier
          - description
          - status
          - created
          - modified
      sort_order:
        type: string
        description: either asc or desc. If this parameter is omitted or no value is specified, or value is not in either asc nor desc, then asc is the default sort order.
        enum:
          - asc
          - desc
  BulkQueryParametersResponseModel:
    type: object
    properties:
      offset:
        type: number
        example: 1
      limit:
        type: number
        example: 50
      total_items:
        type: number
        example: 120
      total_pages:
        type: number
        example: 3
      items:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: parameter id
              example: 5a17c935b015841767bbec64
            identifier:
              type: string
              description: parameter name
              example: Sample Parameter Name
            description:
              type: string
              description: parameter description
              example: Sample Prameter Description
            created:
              type: string
              description: created date in ISODate format
              format: date-time
            modified:
              type: string
              description: modified date in ISODate format
              format: date-time
            status:
              type: string
              description: parameter status active/inactive/archived
              enum:
                - Active
                - Inactive
                - Archived
            project_ids:
              type: array
              description: ids of qTest Manager projects that this parameters belongs to
              items:
                type: number
                example: 62592
            tc_ids:
              type: array
              description: ids of qTest Manager Test Cases that this parameter is used
              items:
                type: string
                example: 364482
            ds_ids:
              type: array
              description: ids of datasets that this parameter is used
              items:
                type: string
                example: 5a17c935b015841767bbec64
            values:
              type: array
              description: values of this parameter, sorting ascending by text
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: parameter value identifier
                    example: 5a17c935b015841767bbec68
                  value:
                    type: string
                    description: parameter value
                    example: Sample Parameter Value
  ### Dataset definitions
  DatasetModel:
    type: object
    properties:
      id:
        type: string
        description: dataset id
        example: 5a17c935b015841767bbec64
      name:
        type: string
        description: dataset name
        example: Sample Dataset name
      description:
        type: string
        description: dataset description
        example: Sample Dataset Description
      status:
        type: string
        description: dataset status active/inactive
        enum:
          - Active
          - Inactive
      project_ids:
        type: array
        description: list of projects specified by projects id that this dataset belongs to
        items:
          type: number
          example: 62592
      created:
        type: string
        description: created date in ISODate format
        format: date-time
      modified:
        type: string
        description: modified date in ISODate format
        format: date-time
      header:
        type: array
        description: list of parameters
        items:
          type: object
          properties:
            col:
              type: number
              description: column index
              example: 0
            param_id:
              type: string
              description: parameter id
              example: 5a17c935b015841767bbec64
            param_name:
              type: string
              description: parameter name
              example: Sample Parameter Name
  CreateDatasetModel:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        description: dataset name
        example: Sample Dataset Name
      description:
        type: string
        description: dataset description
        example: Sample Dataset Description
      status:
        type: string
        description: dataset status active/inactive
        enum:
          - Active
          - Inactive
      project_ids:
        type: array
        description: list of linked project id
        items:
          type: number
          example: 62592
      header:
        type: array
        description: list of parameter header
        items:
          type: object
          properties:
            col:
              type: number
              description: column index
              example: 0
            param_id:
              type: string
              description: parameter id
              example: 5a17c935b015841767bbec64
  SearchDatasetModel:
    type: object
    properties:
      offset:
        type: number
        description: page index. If this parameter is omitted or no value is set then system returns first page by default
        example: 1
      limit:
        type: number
        description: page size. If this parameter is omitted or no value is set then system returns max 500 datasets
        example: 50
      sort_by:
        type: string
        description: field names to sort, possible values are [name | description | status | created]. If no field name is specified, system sorts resukt by last created date
        enum:
          - created
          - name
          - description
          - status
          - modified
      sort_order:
        type: string
        description: either asc or desc. If this parameter is omitted, or no value is specified, or value is not in either asc nor desc, then asc is used as default sort order.
        enum:
          - asc
          - desc
      project_ids:
        type: array
        description: a list of project ids to search for datasets associated to it. If no project ids is specified, serach for datasets associated with any (or no) project
        items:
          type: number
          example: 62592
      name:
        type: string
        description: if specified, query for datasets having name containing the keyword, case insensitive
        example: dataset
      statuses:
        type: array
        description: if specified, query for datasets having one of the status in the array. If not specified at all (null or undefined), search for datasets in any status
        items:
          type: string
          enum:
            - Active
            - Inactive
  CreateDatasetValueModel:
    type: object
    properties:
      cells:
        type: array
        description: list of data values
        items:
          type: object
          properties:
            col:
              type: number
              description: column index
              example: 0
            param_id:
              type: string
              description: parameter id
              example: 5a17c935b015841767bbec64
            value_id:
              type: string
              description: parameter value id
              example: 5a17c935b015841767bbec68
            value_text:
              type: string
              description: parameter value
              example: Sample Parameter Value
  DatasetValueModel:
    type: object
    properties:
      id:
        type: string
        description: dataset value id
        example: 5a17c935b015841767bbec68
      ds_id:
        type: string
        description: dataset id
        example: 5a17c935b015841767bbec66
      cells:
        type: array
        description: list of data values
        items:
          type: object
          properties:
            col:
              type: number
              description: column index
              example: 0
            param_id:
              type: string
              description: parameter id
              example: 5a17c935b015841767bbec64
            value_id:
              type: string
              description: parameter value id
              example: 5a17c935b015841767bbec68
            value_text:
              type: string
              description: parameter value
              example: Sample Parameter Value
  TaskModel:
    type: object
    properties:
      id:
        type: number
        description: task id
        example: 1
      name:
        type: string
        description: task name
        example: ImportParameter
      status:
        type: string
        description: task status
        enum:
          - NEW
          - IN_PROGRESS
          - SUCCESS
          - FAIL
          - AV_SCANNING
          - AV_CLEAN
          - AV_INFECTED
          - AV_CANCEL
          - AV_ERROR
      input:
        type: string
        description: task input
      output:
        type: string
        description: task output
securityDefinitions:
  token:
    name: x-access-token
    type: apiKey
    in: header
