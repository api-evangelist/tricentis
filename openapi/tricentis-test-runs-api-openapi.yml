  /v1/projects/{project-key}/test-runs/{test-run-key}:
    put:
      tags:
      - Test Runs
      summary: Update test run(s).
      description: "## Update an existing test run.\n##### Note: Any values you enter will override existing values in the test run.\n            \n#### Body fields:\n* **testCategory** _(optional)_: The test run category of the test run (\"Functional\" or \"NonFunctional\").\n* **executedBy** _(optional)_: the username or email which the test run is executed by.\n* **assignee** _(optional)_: the username or email which the test run will be assigned to.\n* **priority** _(optional)_: priority of the test run (\"Highes\",\"Low\",etc..).\n* **status** _(optional)_: the status of the test run. Status of test runs is defined in JIRA under the admin page. Mandatory field.\n* **plannedStartDate** _(optional)_: the test run planned start date.\n* **plannedEndDate** _(optional)_: the test run planned end date.\n* **cycleId** _(optional)_: specify the cycle Id which the test runs will be under.\n* **folderPath** _(optional)_: Specify the folder path where you want to move the test run. A path is a string of concatenated parts separated by a slash \"/\".  If you don't specify a folder path, the test run will be under the cycle.\n* **components** _(optional)_: the test runs components.\n* **labels** _(optional)_: the test runs labels.\n* **automation** _(optional)_: the automation content of the test run.\nIn case TestType is Manual, Automation will be ignore (Manual test run can't contain automation content).\n    * **name** _(optional)_: the name of automation tool.\n    * **id** _(optional)_: the id of the test run in the automation tool.\n    * **content** _(mandatory)_: the test run automation content.\n    * **result** _(optional)_: the test run automation result.\n* **steps** _(optional)_: list of steps of the test run.\nIn case TestType is Automated, Steps will be ignore (Automated test run can't contain steps).\n    * **status** _(mandatory)_: the status of the test run step.\n    * **actualResult** _(optional)_: the actual result of the steps.\n    * **comment** _(optional)_: the test run step's comment.\n    * **data** _(optional)_: the test run step's data.\n    * **description** _(optional)_: the test run step's description.\n    * **expectedResult** _(optional)_: the test run step's expectedResult.\n    * **fields** _(optional)_: list of fields of the test run.\n    In case the field is List type (like Environments) allowedValueName must be provided, otherwise (like execution timer) 'value' must be provided.\n        * **schemeName** _(mandatory)_: the scheme name of the field (for example Execution Timer or Environments).\n        * **allowedValueName** _(optional)_: the allowed value of the scheme (for example Development).\n        * **value** _(optional)_: the value of the scheme (for example 130)."
      parameters:
      - name: test-run-key
        in: path
        description: Test Run Key.
        required: true
        schema:
          type: string
      - name: project-key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Patch document.
        content:
          application/json:
            schema:
              type: object
              properties:
                testCategory:
                  type:
                  - string
                  - 'null'
                assignee:
                  type:
                  - string
                  - 'null'
                executedBy:
                  type:
                  - string
                  - 'null'
                plannedStartDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                plannedEndDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                priority:
                  type:
                  - string
                  - 'null'
                status:
                  type:
                  - string
                  - 'null'
                cycleId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                folderPath:
                  type:
                  - string
                  - 'null'
                components:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                labels:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                fields:
                  type:
