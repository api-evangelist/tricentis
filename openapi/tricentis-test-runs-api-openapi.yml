  /v1/projects/{project-key}/test-runs:
    post:
      tags:
      - Test Runs
      summary: Create test run(s).
      description: "## Create or import test run(s).\n##### Note: Release versions are managed in Jira.\n            \n#### Body fields:\n* **version** _(optional)_: Specify the version name which the test runs will be under.\nIf version won't be provided OR version will be equal to unversioned, the test runs will be created under unversioned.\n(creating and editing of releases (versions) are managed in Jira).\n* **cycleName** _(optional)_: Specify the cycle name which the test runs will be under.\n* **folderPath** _(optional)_: Specify the folder path where you want to save the test run. A path is a string of concatenated parts separated by a slash \"/\".  If you don't specify a folder path, the test run will be under the cycle.\n* **includeAttachments** _(optional)_: Specify if to include attachments (default value: false).\nCycle must be provided here or under test runs (for each test runs).\n* **testRuns** _(mandatory)_: Provide a list of test runs, with each test having the following fields:\n    * **testCaseKey** _(mandatory)_: test case key that the test run will be linked to.\n    * **status** _(mandatory)_: the status of the test run. Status of test runs is defined in JIRA under the admin page.\n    * **name** _(optional)_: name of the test run.\n    * **description** _(optional)_: description of the test run.\n    * **priority** _(mandatory)_: priority of the test run (\"Highes\",\"Low\",etc..).\n    * **testCategory** _(mandatory)_: The test run category of the test run (\"Functional\" or \"NonFunctional\").\n    * **testType** _(mandatory)_: the test type of the test run (Manual, Automated).\n    * **cycleName** _(optional)_: specify the cycle name which the test runs will be under.\n    * **folder** _(optional)_: Specify the folder path where you want to save the test run. A path is a string of concatenated parts separated by a slash \"/\".  If you don't specify a folder path, the test run will be under the cycle. If you do not specify the folder in this field, the request uses the folder specified at the root level.\n    Cycle must be provided here or above testRuns in cycleName.\n    * **assignee** _(optional)_: the username or email which the test run will be assigned to.\n    * **executedBy** _(optional)_: the username or email which the test run is executed by.\n    * **automation** _(optional)_: the automation content of the test run.\n    In case TestType is Manual, Automation will be ignore (Manual test run can't contain automation content).\n        * **name** _(optional)_: the name of automation tool.\n        * **id** _(optional)_: the id of the test run in the automation tool.\n        * **content** _(mandatory)_: the test run automation content.\n        * **result** _(optional)_: the test run automation result.\n    * **plannedStartDate** _(optional)_: the test run planned start date.\n    * **plannedEndDate** _(optional)_: the test run planned end date.\n    * **components** _(optional)_: the test runs components.\n    * **labels** _(optional)_: the test runs labels.\n    * **steps** _(optional)_: list of steps of the test run.\n    In case TestType is Automated, and Steps will be provided (Test Run will contain Steps and Automation).\n        * **status** _(mandatory)_: the status of the test run step.\n        * **actualResult** _(optional)_: the actual result of the steps.\n        * **comment** _(optional)_: the test run step's comment.\n        * **data** _(optional)_: the test run step's data.\n        * **description** _(optional)_: the test run step's description.\n        * **expectedResult** _(optional)_: the test run step's expectedResult.\n    * **fields** _(optional)_: list of fields of the test run.\n    In case the field is List type (like Environments) allowedValueName must be provided, otherwise (like execution timer) 'value' must be provided.\n        * **schemeName** _(mandatory)_: the scheme name of the field (for example Execution Timer or Environments).\n        * **allowedValueName** _(optional)_: the allowed value of the scheme (for example Development).\n        * **value** _(optional)_: the value of the scheme (for example 130)."
      parameters:
