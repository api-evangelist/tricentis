      parameters:
      - name: name
        in: query
        description: name.
        schema:
          type: string
      - name: parentId
        in: query
        description: parentId.
        schema:
          type: string
          format: uuid
      - name: project-key
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Numeric value that determines that maximum N results will be returned
        schema:
          type: Integer
          default: 10
          example: 10
      - name: offset
        in: query
        description: 'Numeric value that determines that the result list will start from result #N (zero based)'
        schema:
          type: Integer
          default: 0
          example: 0
      responses:
        '200':
          description: Successfully get folder(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type:
                    - integer
                    - 'null'
                    description: Gets or sets offset.
                    format: int32
                  limit:
                    type:
                    - integer
                    - 'null'
                    description: Gets or sets limit.
                    format: int32
                  totalCount:
                    type: integer
                    description: Gets or sets totalCount.
                    format: int32
                  items:
                    type:
                    - array
                    - 'null'
                    items:
                      required:
                      - name
                      type: object
                      properties:
                        name:
                          minLength: 1
                          type: string
                        parentId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        id:
                          type: string
                          format: uuid
                        projectKey:
                          type:
                          - string
                          - 'null'
                        created:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        updated:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        createdBy:
                          type:
                          - string
                          - 'null'
                        updatedBy:
                          type:
                          - string
                          - 'null'
                        index:
                          type: integer
                          format: int32
                      additionalProperties: false
                    description: Gets or sets items.
                additionalProperties: false
                description: Page Response Scheme.
              examples:
                Created folders:
                  value:
                    offset: 0
                    limit: 2
                    totalCount: 2
                    items:
