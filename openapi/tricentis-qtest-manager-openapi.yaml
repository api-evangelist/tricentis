  /api/v3/projects/{projectId}/auto-test-logs:
    post:
      tags:
      - "test-log"
      summary: "Submits multiple test results and specifies Test Design and Test Execution\
        \ tree structures"
      description: "This is the extended version of this API <strong>POST /api/v3.1/projects/{projectId}/test-runs/{testRunId}/auto-test-logs</strong>.\
        \ It allows submitting multiple test logs in one API request, and creating\
        \ Test Cases and Test Runs in hierarchical structure which is specified in\
        \ the request body\n\n<strong>Important:</strong> This API does not update\
        \ names and locations of existing Test Cases and Test Runs\n\n<strong>Known\
        \ Issue:</strong> This API currently does not update Test Case Version when\
        \ Test Case Properties are updated, and Tricentis is working on a fix that\
        \ will be shipped in an upcoming release"
      operationId: "submitAutomationTestLogsWithTreeStructure"
      parameters:
      - name: "projectId"
        in: "path"
        description: "ID of the project"
        required: true
        type: "integer"
        format: "int64"
      - in: "body"
        name: "body"
        description: "<em>test_cycle (required):</em> PID or ID of the parent Test\
          \ Cycle in qTest Manager where submitted Test Runs will be located\n\n<em>test_logs\
          \ (required):</em> The array of TestLog objects. The below are TestLog attributes\n\
          \n<strong>TestLog attributes:</strong>\n\n- <em>test_case_version_id:</em>\
          \ ID of the associated Test Case's version. In case the Test Run has not\
          \ existed, this field should not be included or it will cause an error\n\
          \n- <em>status (required):</em> The automation result values that were mapped\
          \ with Test Run Result in qTest automation settings\n\n- <em>exe_start_date\
          \ (required):</em> Execution start time\n\n- <em>exe_end_date (required):</em>\
          \ Execution end time\n\n- <em>module_names (required):</em> an array of\
          \ folder names which will be used when creating hierarchical structure in\
          \ Test Design and Test Execution trees. In Test Design tree, the first folder\
          \ will be created as a Module directly under the tree root. Other folders\
          \ will be created as sub-Modules under their preceding folders in the array.\
          \ In Test Execution tree, the first folder will be created as a Test Cycle\
          \ directly under the parent Test Cycle which is specified in the API request.\
          \ Other folders will be created as sub Test Cycles under their preceding\
          \ folders in the array. If there is a folder in the tree with matching name\
          \ and location, the API will not create a duplicate one\n\n- <em>name (required):</em>\
          \ It will be used when <em>creating</em> Test Cases and Test Runs as their\
          \ names. It will not be used for updating Test Case and Test Run names\n\
          \n- <em>automation_content (required):</em> Specify a unique string to each\
          \ Test Case. It acts as Test Case fingerprint. Before adding a Test Log,\
          \ qTest Manager will look up Automation Content of existing Test Cases.\
          \ If it can find an existing Test Case, the Test Log will be associated\
          \ with that Test Case. Otherwise, a new Test Case will be created with the\
          \ submitted Test Log. It is also be used when creating Test Runs. If qTest\
          \ Manager finds an existing Test Run with matching Automation Content and\
          \ location in Test Execution tree, it will not create a duplicate one. If\
          \ there is an existing Test Run with matching Automation Content but it\
          \ is located in different Test Cycles, qTest Manager will create a new Test\
          \ Run in the specified folder\n\n- <em>attachments:</em> an array of the\
          \ Attachment objects\n\n- <em>test_step_logs:</em> an array of TestStepLog\
          \ objects. You can specify Test Steps' order in the request. It must be\
          \ continuous series of numbers, starting from zero, or it will throw an\
          \ error. The order will be used when the Test Case is created or updated\
          \ in qTest. If the order is omitted, Test Steps will be alphabetically sorted\
          \ when creating or updating Test Case\n\n- <em>tosca_guid</em>: GUID of\
          \ Tosca test case. Use for creating Tosca Test Case\n\n- <em>tosca_node_path</em>:\
          \ Node Path of Tosca test case. Use for creating Tosca Test Case\n\n- <em>tosca_guid</em>\
          \ and <em>tosca_node_path</em> are optional but must be specified in pair\n\
          \n<strong>Test Step Log attributes</strong>\n\n- <em>description (required):</em>\
          \ Description of the Test Step\n\n- <em>expected_result (required):</em>\
          \ Expected result of the Test Step\n\n- <em>actual_result (required):</em>\
          \ Actual result of the Test Step\n\n- <em>status (required):</em> The automation\
          \ result values that were mapped with Test Run Result in qTest automation\
          \ settings\n\n- <em>order:</em> Specify the order of Test Steps. It must\
          \ be continuous series of numbers, starting from zero, or it will throw\
          \ an error. The order will be used when the Test Case is created or updated\
          \ in qTest. If the order is omitted, Test Steps will be alphabetically sorted\
          \ when creating or updating Test Case\n\n- <em>exe_date:</em> Execution\
          \ date\n\n- <em>customFieldInfo:</em> Test Step Custom Field Columns. It\
          \ is used to add data to test step custom fields if they exist. You have\
          \ to specify <em>id</em> (Id of Custom Field), <em>value</em> (value for\
          \ Custom Field of the test step), <em>type</em> (Field Type of Custom Field),\
          \ and <em>name</em> (Name of Custom Field)"
        required: true
        schema:
          $ref: "#/definitions/AutomationRequest"
      - name: "type"
        in: "query"
        description: "always use <em>type=automation</em> for this parameter"
        required: true
        type: "string"
        enum:
        - "automation"
      - name: "escapeXml"
        in: "query"
        description: "<em>escapeXml=true</em> - default value. &gt and &lt in <em>Automation\
          \ Content</em> field are encoded\n\n<em>escapeXml=false</em> - the Automation\
          \ Content field is not encoded"
        required: false
        type: "boolean"
      - name: "userId"
        in: "query"
        required: false
        type: "string"
      responses:
        201:
          description: "Automation Test Logs submitted,\n\n<em>id:</em> ID of the\
            \ submission job. You will need this Id to check the job status using\
            \ <strong>GET /api/v3/projects/queue-processing/{jobId}</strong>\n\n<em>state:</em>\
            \ Status of the job. Its value includes IN_WAITING, IN_PROCESSING, FAILED,\
            \ PENDING, and SUCCESS"
          schema:
            $ref: "#/definitions/QueueProcessingResponse"
        400:
          description: "Bad request - Unexpected error occurred"
        413:
          description: ""
      security:
      - Authorization: []
