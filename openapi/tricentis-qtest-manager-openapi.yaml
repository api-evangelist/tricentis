  /api/v3/projects/{projectId}/test-runs/{testRunId}/auto-test-logs:
    post:
      tags:
      - "test-log"
      summary: "Submits an Automation Test Log"
      description: "To submit test result of an Automation Test Run\n\n<strong>Known\
        \ Issue:</strong> This API currently does not update Test Case Version when\
        \ Test Case Properties are updated, and Tricentis is working on a fix that\
        \ will be shipped in an upcoming release\n\n<strong>qTest Manager version:</strong>\
        \ 4+"
      operationId: "submitAutomationLog"
      parameters:
      - name: "projectId"
        in: "path"
        description: "ID of the project"
        required: true
        type: "integer"
        format: "int64"
      - in: "body"
        name: "body"
        description: "<em>status (required):</em> automation status values which are\
          \ mapped in qTest Manager's Automation Settings\n\n<em>exe_start_date (required):</em>\
          \ the execution's starting time\n\n<em>exe_end_date (required)</em> the\
          \ execution's ending time\n\n<em>name (required)</em> name of the Test Run\
          \ or Test Case\n\n<em>automation_content (required):</em> a string that\
          \ uniquely identifies an Automation Test Case\n\n<em>attachments:</em> a\
          \ JSONArray of Attachment objects\n\n<em>note:</em> execution note\n\n<em>test_case_version_id:</em>\
          \ ID of the associated Test Case's version\n\n<em>test_step_logs:</em> a\
          \ JSONArray of TestStepLog objects\n\n<em>testcase_properties:</em> An of\
          \ Testcase properties objects. You can specify Test case properties' order\
          \ in the request. \n\n<em>tosca_guid</em>: GUID of Tosca test case. Use\
          \ for creating Tosca Test Case\n\n<em>tosca_node_path</em>: Node Path of\
          \ Tosca test case. Use for creating Tosca Test Case\n\n<em>tosca_guid</em>\
          \ and <em>tosca_node_path</em> are optional but must be specified in pair"
        required: true
        schema:
          $ref: "#/definitions/AutomationTestLogResource"
      - name: "suitePerDay"
        in: "query"
        description: "<em>suitePerDay=true</em> - the newly created Test Run will\
          \ be located under a Test Suite named under the execution date specified\
          \ in parameter <em>suiteDate</em>, eg: <em>Automation 2014-12-09</em>\n\n\
          <em>suitePerDay=false</em> - the newly created Test Run will be located\
          \ under <em>Automation Test Suite</em>\n\n<strong>IMPORTANT:</strong> In\
          \ case you update an existing Test Run, its Test Suite remains unchanged"
        required: false
        type: "string"
      - name: "suiteDate"
        in: "query"
        description: "It is required if <em>suitePerDay</em> is true. Its format is\
          \ <em>\"yyyymmdd\"</em>. \n\nThe newly created Test Run will be located\
          \ under a Test Suite named \"Automation yyyy-mm-dd\", eg: Automation 2014-12-09"
        required: false
        type: "string"
      - name: "encodeNote"
        in: "query"
        description: "Specify if the Test Log's Notes are in HTML format\n\n<em>encodeNote=true</em>\
          \ - default value. Notes are not in HTML format\n\n<em>encodeNote=false:</em>\
          \ Notes are in HTML format"
        required: false
        type: "boolean"
        default: true
      - name: "forceUpdateVersion"
        in: "query"
        required: false
        type: "boolean"
        default: false
      - name: "agentId"
        in: "query"
        required: false
        type: "string"
      - name: "userId"
        in: "query"
        required: false
        type: "string"
      - name: "testRunId"
        in: "path"
        description: "ID of the Test Run\n\n1/ If it is greater than 0 (zero), test\
          \ result will be submitted to the specific Test Run\n\nIf it is 0 (zero),\
          \ test result will be submitted to a new Test Run"
        required: true
        type: "integer"
        format: "int64"
      responses:
        201:
          description: "Automation Log submitted"
          schema:
            $ref: "#/definitions/AutomationTestLogResourceResponse"
        413:
          description: ""
        500:
          description: "Internal Server Error - Unexpected error occurred"
      security:
      - Authorization: []
