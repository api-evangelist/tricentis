      description: "To invite a user to your qTest Manager instance and activate the\
        \ account. If the password is omitted, the default \"<em>admin123</em>\" will\
        \ be used\n\n<strong>qTest Manager version:</strong> 4+"
      operationId: "createUser"
      parameters:
      - in: "body"
        name: "body"
        description: "Invited user's information\n\n<em>username (require)</em>: email\
          \ of new user\n\n<em>email</em>: This field will be ignored and primary\
          \ email will be set\n\n<em>password</em>: password of new user. If the password\
          \ is omitted, the default \"admin123\" will be used\n\n<em>first_name (require)</em>:\
          \ First name of new user\n\n<em>last_name (require)</em>: Last name of new\
          \ user\n\n<em>user_group_ids</em>: List usergroup ids will be assigned for\
          \ new user.\n\n<em>send_activation_email</em>: activation email will be\
          \ ignored if this is set to <strong>false</strong>. Default value is <strong>false</strong>\n\
          \n<em>external_auth_config_id</em>: auto assign this new user with External\
          \ Authentication system by this providing config id here. If this value\
          \ is provided, <em>\"external_user_name\"</em> need to have value, or it\
          \ will failed to create.\n\n<em>external_user_name</em>: external username\
          \ that will be assigned to newly created qTest user \n\n<em>include_default_groups</em>:Include\
          \ default groups or not. Default value is <strong>false</strong>"
        required: true
        schema:
          $ref: "#/definitions/UserResource"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/UserResource"
      security:
      - Authorization: []
  /api/v3/users/projects:
    post:
      tags:
      - "user"
      summary: "Assigns multiple Users to a Project"
      description: "To assign a list of Users to a Project\n\n<strong>qTest Manager\
        \ version:</strong> 4+"
      operationId: "assignUsersToProject"
      parameters:
      - in: "body"
        name: "body"
        description: "ID of the Project and an array of assigned Users' IDs. If the\
          \ profile is not provided, Developer profile is used by default"
        required: true
        schema:
          $ref: "#/definitions/AssignedUsersProject"
      - name: "skipEmailNotifications"
        in: "query"
        description: "Set to true to skip email notifications about associating user\
          \ with a project."
        required: false
        type: "boolean"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/AssignedUsersProject"
      security:
      - Authorization: []
    put:
      tags:
      - "user"
      summary: "Remove association between users and projects"
      description: "To remove association between users and projects"
      operationId: "removeAssociationUsersAndProjects"
      parameters:
      - in: "body"
        name: "body"
        description: "An array of pairs project_id and user_ids\n\n <em>project_id:</em>\
          \ ID of the project\n\n<em>user_ids: </em> List of User IDs which are being\
          \ removed from the project"
        required: true
        schema:
          type: "array"
          items:
            $ref: "#/definitions/ProjectWithUserIdsObject"
      - name: "skipEmailNotifications"
        in: "query"
        description: "Set to true to skip email notifications about removing user's\
          \ association with a project."
        required: false
        type: "boolean"
      responses:
        200:
          description: ""
          schema:
            $ref: "#/definitions/Message"
      security:
      - Authorization: []
  /api/v3/users/search:
    get:
      tags:
      - "user"
      summary: "Queries Users by Username"
      description: "To query for users by their username\n\n<strong>qTest Manager\
        \ version:</strong> 8.4.2+"
      operationId: "findByUserNameOrEmail"
      parameters:
      - name: "username"
        in: "query"
        description: "API will return users which have been added to projects whose\
          \ names contain the text specified in this parameter.\n\nLogin names of\
          \ users should be provided for this query, but they vary based on the source\
          \ of the user.\n\n- qTest Login Email - for users created directly on qTest\n\
          \n- LDAP or SSO username or external username - for users created from LDAP\
          \ or SSO"
        required: false
        type: "string"
      - name: "includeInactiveUsers"
        in: "query"
        description: "<em>includeInactiveUsers=false</em> - default value. Inactive\
          \ users are excluded from the response\n\n<em>includeInactiveUsers=true</em>\
          \ - inactive users are included in the response"
        required: false
        type: "boolean"
      - name: "pagination"
        in: "query"
        description: "<em>pagination=true</em> - default value. The result is paginated\n\
          \n<em>pagination=false</em> - the result is not paginated"
        required: false
        type: "boolean"
        default: true
      - name: "authSystemConfigIds"
        in: "query"
        description: "LDAP Configuration Ids"
        required: false
        type: "array"
        items:
          type: "integer"
          format: "int64"
        collectionFormat: "multi"
      - name: "page"
        in: "query"
        description: "By default the first page is returned but you can specify any\
          \ page number to retrieve objects"
        required: false
        type: "integer"
        default: 1
        format: "int64"
      - name: "pageSize"
        in: "query"
        description: "The result is paginated. By the default, the number of objects\
          \ in each page is 100 if this is omitted. You can specify your custom number\
          \ (up to 100) in this parameter."
        required: false
        type: "integer"
        default: 100
        format: "int64"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/SearchUserResourceExtensionResponse"
      security:
      - Authorization: []
  /api/v3/users/{userId}:
    get:
      tags:
      - "user"
      summary: "Gets a User"
      description: "To retrieve a User's information"
      operationId: "getUserById"
      parameters:
      - name: "userId"
        in: "path"
        description: "ID of the user."
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/UserResource"
      security:
      - Authorization: []
    put:
      tags:
      - "user"
      summary: "Update user's information"
      description: "To update information of a user, like : recovery email, password,\
        \ status..."
      operationId: "updateUser"
      parameters:
      - name: "userId"
        in: "path"
        description: "ID of the user."
        required: true
        type: "integer"
        format: "int64"
      - in: "body"
        name: "body"
        description: "Update user's information\n\n<em>email</em>: This field will\
          \ be ignored and primary email will be set\n\n<em>password</em>: New password\
          \ of user. Password have to map with password policy of current user's client\n\
          \n<em>first_name</em>: New first name of user\n\n<em>last_name</em>: New\
          \ last name of user\n\n<em>user_group_ids</em>: List usergroup ids will\
          \ be assigned for user (old usergroup ids will be replaced).\n\n<em>external_auth_config_id</em>:\
          \ New user's external authenticate id,it will auto assign this user with\
          \ External Authentication system by this providing config id here. If this\
          \ value is provided, <em>\"external_user_name\"</em> need to have value,\
          \ or it will failed to update. For internal authentication system input\
          \ : <strong>-1</strong>\n\n<em>external_user_name</em>: external username\
          \ that will be assigned to user (if LDAP external is specified, \"first_name\"\
          \ and \"last_name\" will be fetch from LDAP system).\n\n<em>status</em>:\
          \ New status id of user. Status id must be <strong>1</strong> for Active\
          \ or <strong>3</strong> for Inactive status."
        required: true
        schema:
          $ref: "#/definitions/UserUpdateResource"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/UserResource"
      security:
      - Authorization: []
  /api/v3/users/{userId}/avatar:
    get:
      tags:
      - "user"
      summary: "Gets a User's Avatar"
      description: "To retrieve a User's Avatar"
      operationId: "getAvatar"
      parameters:
      - name: "userId"
        in: "path"
        description: "ID of the user."
        required: true
        type: "integer"
        format: "int64"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/OutputStream"
      security:
      - Authorization: []
  /api/v3/users/{userId}/projects:
    post:
      tags:
      - "user"
