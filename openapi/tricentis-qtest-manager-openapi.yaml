      security:
      - Authorization: []
  /api/v3/webhooks:
    get:
      tags:
      - "webhook"
      summary: "Gets list of all registered webhooks"
      description: "To retrieve list of all registered webhooks"
      operationId: "getAllWebhooks"
      parameters: []
      responses:
        200:
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/WebhookVM"
      security:
      - Authorization: []
    post:
      tags:
      - "webhook"
      summary: "Registers a webhook"
      description: "To register a webhook"
      operationId: "createWebhook"
      parameters:
      - in: "body"
        name: "body"
        description: "<em>name (required):</em> name of the webhook\n\n<em>URL (required):</em>\
          \ where the callback should be sent\n\n<em>secretkey (required):</em> secretkey\
          \ is used to ensure that POST requests sent to the URL are from qTest\n\n\
          <em>responseType (optional):</em> content-type of the callback message.\
          \ Allow values: \"text\" for <b>text/plain</b>, \"json\" for <b>application/json</b>.\
          \ Default value is \"text\"\n\n<em>events (required):</em> list event(s)\
          \ to register. Its valid values include\n\n- testcase_created\n\n- testcase_updated\n\
          \n- testcase_deleted\n\n- testcase_approved\n\n- testrun_created\n\n- testrun_updated\n\
          \n- testrun_deleted\n\n- testlog_submitted\n\n- testlog_modified\n\n- project_created\n\
          \n- project_updated\n\n- defect_submitted\n\n- defect_modified\n\n- requirement_created\n\
          \n- requirement_updated\n\n- requirement_deleted\n\n- requirement_linked\n\
          \n- requirement_unlinked\n\n- defect_linked\n\n- defect_unlinked\n\n<em>projectIds\
          \ (optional):</em> list valid projectid(s) to register. Its valid values\
          \ include only Active Projects"
        required: true
        schema:
          $ref: "#/definitions/WebhookRequest"
      responses:
        201:
          description: "successful operation"
          schema:
            $ref: "#/definitions/WebhookVM"
        400:
          description: "Bad Request if missing or invalid input value in body"
      security:
      - Authorization: []
  /api/v3/webhooks/events:
    get:
      tags:
      - "webhook"
      summary: "Get list of webhook event names"
      description: "To retrieve list of all available event names for webhook registering"
      operationId: "getAllEventNames"
      parameters: []
      responses:
        200:
          description: "successful operation"
          schema:
            type: "array"
            items:
              type: "string"
      security:
      - Authorization: []
  /api/v3/webhooks/{webhookId}:
    get:
      tags:
      - "webhook"
      summary: "Gets a webhook"
      description: "To retrieve details of a registered webhook"
      operationId: "getWebhookById"
      parameters:
      - name: "webhookId"
        in: "path"
        description: "ID of the webhook"
        required: true
        type: "string"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/WebhookVM"
      security:
      - Authorization: []
    put:
      tags:
      - "webhook"
      summary: "Updates a webhook"
      description: ""
      operationId: "updateWebhook"
      parameters:
      - name: "webhookId"
        in: "path"
        description: "ID of the webhook"
        required: true
        type: "string"
      - in: "body"
        name: "body"
        description: "Update webhook's information\n\n<em>name:</em> New name of the\
          \ webhook\n\n<em>URL:</em> New URL of the webhook\n\n<em>secretkey:</em>\
          \ New secret key of the webhook\n\n<em>responseType:</em> New content-type\
          \ of the callback message. Allow values: \"text\" for <b>text/plain</b>,\
          \ \"json\" for <b>application/json</b>\n\n<em>events (required):</em> New\
          \ list event(s) to register. Its valid values include\n\n- testcase_created\n\
          \n- testcase_updated\n\n- testcase_deleted\n\n- testcase_approved\n\n- testrun_created\n\
          \n- testrun_updated\n\n- testrun_deleted\n\n- testlog_submitted\n\n- testlog_modified\n\
          \n- project_created\n\n- project_updated\n\n- defect_submitted\n\n- defect_modified\n\
          \n- requirement_created\n\n- requirement_updated\n\n- requirement_deleted\n\
          \n- requirement_linked\n\n- requirement_unlinked\n\n- defect_linked\n\n\
          - defect_unlinked\n\n<em>projectIds (optional):</em> list valid projectid(s)\
          \ to register. Its valid values include only Active Projects"
        required: true
        schema:
          $ref: "#/definitions/WebhookRequest"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/WebhookVM"
      security:
      - Authorization: []
    delete:
      tags:
      - "webhook"
      summary: "Deletes a webhook"
      description: "To delete a registered webhook"
      operationId: "deleteWebhookById"
      parameters:
      - name: "webhookId"
        in: "path"
        description: "ID of the webhook"
        required: true
        type: "string"
      responses:
        200:
          description: "successful operation"
          schema:
            type: "object"
      security:
      - Authorization: []
  /api/v4/projects/{projectId}/test-cases/{testCaseId}/test-steps:
    get:
      tags:
      - "test-case"
      summary: "Gets Test Steps of a Test Case"
      description: "To retrieve all Test Steps of a Test Case's latest version\n\n\
        <strong>qTest Manager version:</strong> 6+"
      operationId: "getTestStepsOfTestCase"
      parameters:
      - name: "projectId"
        in: "path"
        description: "ID of the project"
        required: true
        type: "integer"
        format: "int64"
      - name: "testCaseId"
        in: "path"
        description: "ID of the Test Case"
        required: true
        type: "integer"
        format: "int64"
      - name: "page"
        in: "query"
        description: "By default the first page is returned but you can specify any\
          \ page number to retrieve objects"
        required: false
        type: "integer"
        default: 1
        format: "int64"
      - name: "size"
        in: "query"
        description: "size"
        required: false
        type: "integer"
        default: 200
        format: "int32"
      - name: "showParamIdentifier"
        in: "query"
        description: "By default, Parameters in Test Steps are displayed in ID number\
          \ mode (like \"<strong>[~123]</strong>\"). Input <strong><em>showParamIdentifier=true</em></strong>\
          \ to change to Identifier text mode. Result should be like \"<strong>[~myIdentifier]</strong>\"\
          ."
        required: false
        type: "boolean"
        default: false
      responses:
        200:
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/TestStepResource"
      security:
      - Authorization: []
  /api/v4/projects/{projectId}/test-cases/{testCaseId}/versions/{versionId}/test-steps:
    get:
      tags:
      - "test-case"
      summary: "Gets Test Steps of a Test Case version"
      description: "To retrieve all Test Steps of a specific Test Case version"
      operationId: "getTestStepsByVersionId"
      parameters:
      - name: "projectId"
        in: "path"
        description: "ID of the project"
        required: true
        type: "integer"
        format: "int64"
      - name: "testCaseId"
        in: "path"
        description: "ID of the Test Case"
        required: true
        type: "integer"
        format: "int64"
      - name: "versionId"
        in: "path"
        description: "ID of the Test Case version"
        required: true
        type: "integer"
        format: "int64"
      - name: "expand"
        in: "query"
        description: "when you Specify <em>expand=calledteststep</em> \n\nIt will\
          \ include Test Steps of the called Test Cases in your response."
        required: false
        type: "string"
        enum:
        - "calledteststep"
      - name: "page"
        in: "query"
        description: "By default the first page is returned but you can specify any\
          \ page number to retrieve objects"
        required: false
        type: "integer"
        default: 1
        format: "int64"
      - name: "size"
        in: "query"
        description: "size"
        required: false
        type: "integer"
        default: 200
        format: "int32"
      - name: "showParamIdentifier"
        in: "query"
        description: "By default, Parameters in Test Steps are displayed in ID number\
          \ mode (like \"<strong>[~123]</strong>\"). Input <strong><em>showParamIdentifier=true</em></strong>\
          \ to change to Identifier text mode. Result should be like \"<strong>[~myIdentifier]</strong>\"\
          ."
        required: false
        type: "boolean"
        default: false
      responses:
        200:
          description: "successful operation"
          schema:
            type: "object"
      security:
      - Authorization: []
  /oauth/status:
    get:
      tags:
      - "login"
      summary: "Gets status of access token"
      description: "Gets status of access token"
      operationId: "tokenStatus"
      parameters:
      - name: "Authorization"
        in: "header"
        description: "The qTest access token you want to check"
        required: false
        type: "string"
      responses:
        200:
          description: "<em>expiration</em> timestamp and <em>validityInMilliseconds</em>\
            \ of provided access token are returned in the response."
          schema:
            $ref: "#/definitions/OAuthTokenStatusVM"
        401:
          description: "Invalid access token"
      security:
      - Authorization: []
  /oauth/token:
    post:
      tags:
      - "login"
      summary: "Log in"
      description: "To authenticate the API client against qTest Manager and acquire\
        \ authorized access token. \n\n Note: Please choose parameter <em>content-type=application/x-www-form-urlencoded</em>"
      operationId: "postAccessToken"
      consumes:
      - "application/x-www-form-urlencoded"
      parameters:
      - name: "grant_type"
        in: "formData"
        description: "Use <em>grant_type=password</em> or <em>grant_type=refresh_token</em>\
          \ to refresh access token"
        required: false
        type: "string"
        default: "password"
        enum:
        - "password"
        - "refresh_token"
      - name: "username"
        in: "formData"
        description: "Your qTest Manager username"
        required: false
        type: "string"
      - name: "password"
        in: "formData"
        description: "Your qTest Manager password"
        required: false
        type: "string"
      - name: "refresh_token"
        in: "formData"
        description: "qTest refresh token to refresh access token associate with provided\
          \ refresh token"
        required: false
        type: "string"
      - name: "Authorization"
        in: "header"
        description: "Basic + [base64 string of \"<strong>your qTest site name and\
          \ colon</strong>\"]\n\nor Basic cXRlc3QtYXBpOg== [base64 string of \"<strong>qtest-api:</strong>\"\
          ] to use refresh token (grant_type = refresh_token)\n\nExample: qTest Manager\
          \ site is: apitryout.qtestnet.com then site name is: apitryout + ':', then\
          \ Authorization is: Basic YXBpdHJ5b3V0Og=="
        required: false
        type: "string"
      responses:
        200:
          description: "<em>token_type</em> and <em>access_token</em> are included\
            \ in the response.\n\nUse them in Authorization key when making API calls\
            \ to qTest Manager in following format: <strong>[token_type] [access_token]</strong>"
          schema:
            $ref: "#/definitions/OAuthResponse"
        400:
          description: "Invalid refresh token or grant type"
        401:
          description: "Missing or invalid Authorization header value"
securityDefinitions:
  Authorization:
    type: "apiKey"
    name: "Authorization"
    in: "header"
definitions:
  AdminProfile:
    type: "object"
    properties:
      user_id:
        type: "integer"
        format: "int64"
        example: 1
        description: "ID of the user"
      create_project:
        type: "boolean"
        example: true
        description: "Has permission on create Project"
      edit_project:
        type: "boolean"
        example: true
        description: "Has permission on edit Project"
      archive_project:
        type: "boolean"
        example: true
        description: "Has permission on archive Project"
      list_project:
        type: "boolean"
        example: true
        description: "Has permission on view Project"
      manage_client_user:
        type: "boolean"
        example: true
        description: "Has permission on Invite/Edit Users"
      edit_user_profile:
        type: "boolean"
        example: true
        description: "Has permission on edit Profiles"
      view_user_profile:
        type: "boolean"
        example: true
        description: "Has permission on view Profiles"
      manage_client_info:
        type: "boolean"
        example: true
        description: "Has permission on update Company's information"
      manage_system_conf:
        type: "boolean"
        example: true
        description: "Has permission on manage System configuration"
      site_level_field:
        type: "boolean"
        example: true
        description: "Has permission on manage site level field setting"
      manage_user_group:
        type: "boolean"
      insight_viewer:
        type: "boolean"
      insight_editor:
        type: "boolean"
      pulse_access:
        type: "boolean"
      launch_access:
        type: "boolean"
      analytics_viewer:
        type: "boolean"
      copilot_user:
        type: "boolean"
  AllowedValueInputResource:
    type: "object"
    properties:
      default:
        type: "boolean"
      value:
        type: "integer"
        format: "int64"
      label:
        type: "string"
      order:
        type: "integer"
        format: "int32"
      is_default:
        type: "boolean"
      is_active:
        type: "boolean"
      color:
        type: "string"
  AllowedValueResource:
    type: "object"
    properties:
      links:
        type: "array"
        readOnly: true
        items:
          $ref: "#/definitions/Link"
      value:
        type: "integer"
        format: "int64"
        example: 601
        description: "Value of AllowedValue"
      label:
        type: "string"
        example: "Passed"
        description: "Label of AllowedValue"
      order:
        type: "integer"
        format: "int32"
        example: 1
        description: "Display order of AllowedValue"
      is_default:
        type: "boolean"
        example: true
        description: "Is default value or not"
      is_active:
        type: "boolean"
        example: true
        description: "Is active or not"
      color:
        type: "string"
        example: "#c0c0c0"
        description: "Color of AllowedValue if Field is Test Run's Status "
  AllowedValueResponseResource:
    type: "object"
    properties:
      links:
        type: "array"
        readOnly: true
        items:
          $ref: "#/definitions/Link"
      total:
        type: "integer"
        format: "int64"
      items:
        type: "array"
        items:
          $ref: "#/definitions/AllowedValueResource"
  AppDetail:
    type: "object"
    properties:
