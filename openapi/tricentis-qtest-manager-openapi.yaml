  /api/v3/projects/{projectId}/search:
    post:
      tags:
      - "search"
      summary: "Queries objects"
      description: "This API mimics the Data Query function of qTest Manager web app.\
        \ It provides the capability to query Requirements, Test Cases, Test Runs\
        \ and <em>internal</em> Defects"
      operationId: "searchArtifact"
      produces:
      - "application/json"
      parameters:
      - name: "projectId"
        in: "path"
        description: "ID of the project"
        required: true
        type: "integer"
        format: "int64"
      - in: "body"
        name: "body"
        description: "<em>object_type (required):</em> Its value can be <em>releases</em>,\
          \ <em>requirements</em>, <em>test-cases</em>, <em>test-runs</em>, <em>test-suites</em>,\
          \ <em>test-cycles</em>, <em>test-logs</em>, <em>builds</em>, or <em>defects</em>.\n\
          \n<em>fields:</em> specify which object fields you want to include in the\
          \ response. If you omit it or specify an asterisk (*), all fields are included.\n\
          \n<em>query:</em> specify a structured query to search for qTest Manager\
          \ objects. Basically, you can use the Query Summary text as in qTest web\
          \ app for this attribute.\n\n<strong>IMPORTANT:</strong> When using Query\
          \ Summary to specify the query, you will need to modify the Query Summary\
          \ in some special cases as below:\n\n- If there are spaces in the criteria\
          \ name, put it between '  ' (single quotation marks).\n\n- There need to\
          \ be spaces between a criteria, an operator, and a value.\n\n- You can use\
          \ field name or field ID in the query.\n\n- For the fields with datetime\
          \ as the data type, convert the values to ISO Date Time format.\n\n- Operator\
          \ \"IN\" for fields with datetime as the data type will search for the values\
          \ within this range: inputted date time &lt;= value &lt;= (inputted date\
          \ time + 23h59m59s).\n\n- <em>Affected Release/Build:</em> You can use either\
          \ Affected Release or Affected Build as criteria in a query. This criterion\
          \ can be used only for <em>defects</em>.\n\n- <em>Target Release/Build:</em>\
          \ You can use either Target Release or Target Build as criteria in a query.\
          \ This criterion can be used for <em>requirements</em>, <em>test-runs</em>,\
          \ <em>defects</em>, <em>test-logs</em>, and <em>test-cycles</em>. Release\
          \ Id should be passed as Negative value.\n\n- <em>Fixed Release/Build:</em>\
          \ You can use either Fixed Release or Fixed Build as criteria in a query.\
          \ This criterion can be used only for <em>defects</em>.\n\n- <em>Subscribers</em>:\
          \ Use user ID instead of username in the query for this criteria.\n\n- You\
          \ need to use id or pid for the following fields when using them in a query:\
          \ Affected Release, Affected Build, Target Release, Target Build, Fixed\
          \ Release, and Fixed Build.\n\n- Use <em>~</em> for operator <em>contains</em>,\
          \ and <em>!~</em> for operator <em>not contains</em>. Eg: instead of <em>Name\
          \ contains \"login\"</em>, use <em>Name ~ \"login\"</em>\n\n- Use operator\
          \ <em>is not empty</em> in the following way: <strong>is 'not empty'</strong>.\
          \ Eg: \"Name is 'not empty'\"\n\n- For builds and test-cycles, you can use\
          \ the following additional criterion: <em>Created Date</em> and <em>Last\
          \ Modified Date</em> in a query. Eg: 'Created Date' > '2021-05-07T03:15:37.652Z'\n\
          \n- For test-logs, you can use the following additional criterion: <em>Execution\
          \ Start Date</em> and <em>Execution End Date</em> in a query. Eg: 'Execution\
          \ Start Date' > '2021-05-07T03:15:37.652Z'"
        required: true
        schema:
          $ref: "#/definitions/ArtifactSearchParams"
      - name: "appendTestSteps"
        in: "query"
        description: "By default, For Test Case(s) test steps are not included in\
          \ the response. Specify appendTestSteps=true to include them."
        required: false
        type: "boolean"
      - name: "includeExternalProperties"
        in: "query"
        description: "By default, For Requirement(s) external properties are not included\
          \ in the response. Specify includeExternalProperties=true to include them."
        required: false
        type: "boolean"
        default: false
      - name: "includeTestLogProperties"
        in: "query"
        description: "By default, For Test Log(s) properties and Test step logs are\
          \ not included in the response. Specify expandTestLogProperties=true to\
          \ include them."
        required: false
        type: "boolean"
        default: false
      - name: "pageSize"
        in: "query"
        description: "The result is paginated. By the default, the number of objects\
          \ in each page is 100 if this is omitted. You can specify your custom number\
          \ (up to 999) in this parameter"
        required: false
        type: "integer"
        default: 100
        format: "int64"
      - name: "page"
        in: "query"
        description: "By default the first page is returned but you can specify any\
          \ page number to retrieve objects"
        required: false
        type: "integer"
        default: 1
        format: "int64"
      responses:
        200:
          description: "Return list of Requirements, Test Cases, Test Runs and internal\
            \ Defects"
          schema:
            $ref: "#/definitions/PagedResource"
      security:
      - Authorization: []
