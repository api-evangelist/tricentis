      description: '## Get or retrieve information from test case(s).


        #### Body fields:

        * **jiraFields**: a comma-separated list of Jira fields to return for each issue. Use this to retrieve a subset of fields.

        * **ttmFields**: a comma-separated list of Jira fields to return for each issue. Use this to retrieve a subset of fields.

        * **folderId**: an optional folder ID to filter test cases. If provided, only test cases in the specified folder (including all child folders) will be returned. Cannot be used together with folderPath.

        * **folderPath**: an optional folder path to filter test cases. If provided, only test cases in the specified folder path (including all child folders) will be returned. Example: "Main Folder/Child Folder". Cannot be used together with folderId.'
