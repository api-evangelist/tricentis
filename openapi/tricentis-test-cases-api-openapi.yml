                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                expectedResult:
                                  type:
                                  - string
                                  - 'null'
                                data:
                                  type:
                                  - string
                                  - 'null'
                                description:
                                  type:
                                  - string
                                  - 'null'
                                testCaseKey:
                                  type:
                                  - string
                                  - 'null'
                              additionalProperties: false
                        additionalProperties: false
                      automation:
                        required:
                        - name
                        type: object
                        properties:
                          name:
                            minLength: 1
