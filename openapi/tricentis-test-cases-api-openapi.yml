    post:
      tags:
      - Test Cases
      summary: Create test case(s)
      description: '## Create test case(s).


        #### Body fields:


        * **folder** _(optional)_: Specify the folder path where you want to save the test case. A path is a string of concatenated parts separated by a slash "/". If you don''t specify a folder path, the test case saves in the "All tests" folder. Do not specify both the folder and the folderID, or the request will fail.

        * **folderId** _(optional)_: Specify a unique ID associated with the folder in the TTM database, which specifies where the test case should be saved. Do not specify both the folder and the folderID, or the request will fail.

        * **callbackUrl** _(optional)_: Specify a URL that will recevie status of the request (The URL will serve as POST endpoint in the user side).

        * **tests**: Provide a list of tests with the following values:

        * **fields**: The native Jira fields in a test case. The following fields are available:

        * **summary**: The Summary of the test case in Jira.

        * **description** _(optional)_: The Description of the test case in Jira.

        * **status** _(optional)_: The Status of the test case in Jira.

        * **priority** _(optional)_: The Priority of the test case in Jira.

        * **labels** _(optional)_: The Labels of the test case in Jira.

        * **ttmFields**: These are the Jira fields provided by the Tricentis Test Management for Jira plugin. The following fields are available:

        * **precondition** _(optional)_: The precondition for a test case.

        * **steps** _(optional)_: The list of steps for the test case.

        * **description** _(optional)_: Step description.

        * **expectedResult** _(optional)_: Step expected result.

        * **data** _(optional)_: Step data.

        * **testCaseKey** _(optional)_: test case key, when set the step will call the test case and other step fields will be ignored.

        * **testType**: Can be one of the following: "Manual", "Automated"

        * **requirements** _(optional)_: List of issues keys (from Jira) that should be linked as requirements.

        * **customFields** _(optional)_: The custom Jira fields in a test case.

        * **folder** _(optional)_: Specify the folder path where you want to save the test case. A path is a string of concatenated parts separated by a slash "/". If you don''t specify a folder path, the test case saves in the "All tests" folder. Do not specify both the folder and the folderID, or the request will fail. If you do not specify the folder in this field, the request uses the folder specified at the root level.

        * **folderId** _(optional)_: Specify a unique ID associated with the folder in the TTM database, which specifies where the test case should be saved. Do not specify both the folder and the folderID, or the request will fail. If you do not specify the folderId in this field, the request uses the folderId specified at the root level.

        * **automation** _(optional)_: Automation data. Provide the following values for your test case:

        * **name**: The name of your external automation system. For example, Testim.

        * **externalId** _(optional)_: The ID of the test in your external automation platform.

        * **content** _(optional)_: The content your automation system supplies to represent the test.'
      parameters:
      - name: strictOrder
        in: query
        description: If strict order is true, test-cases will be created according to the given order.
        schema:
          type: boolean
          default: false
      - name: project-key
