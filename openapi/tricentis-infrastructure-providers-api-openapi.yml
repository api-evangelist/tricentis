        - HTTP 503 | Code: 300 | Message : An unexpected error occurred while processing the request.

        - HTTP 501 | Code: 301 | Message : Not supported when the reservation mode is enabled.

        - HTTP 501 | Code: 302 | Message : Not supported when the reservation mode is OFF.

        - HTTP 413 | Message : Request Entity Too Large.

        '
    DynamicInfrastructureProviderApiResponseDto:
      type: object
      properties:
        agentId:
          type: string
        connectionType:
          type: string
          enum:
          - CLIENT_BASED
          - AGENT_BASED
        id:
          type: string
        name:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
            description: parameters applied to provider.
            example: '{"K8S_API_END_POINT":"https://example/api","K8S_NAMESPACE":"kubernetes-namespace","K8S_LABELS":"","K8S_ANNOTATIONS":"","K8S_NODE_SELECTORS":""}'
          description: parameters applied to provider.
          example:
            K8S_API_END_POINT: https://example/api
            K8S_NAMESPACE: kubernetes-namespace
            K8S_LABELS: ''
            K8S_ANNOTATIONS: ''
            K8S_NODE_SELECTORS: ''
        type:
          type: string
          enum:
          - AWS
          - GCE
          - AZURE
          - KUBERNETES
          - OPEN_SHIFT
          - DOCKER_ENGINE
          - DOCKER_SWARM
          - NCP
  securitySchemes:
    NeoloadAuthorizer:
      type: apiKey
      name: accountToken
      in: header
