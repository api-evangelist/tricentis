          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  issueKey:
                    type:
                    - string
                    - 'null'
                additionalProperties: false
            examples:
              DefectsApiData:
                value:
                - issueKey: Key-1
                - issueKey: Key-2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    summary:
                      type:
                      - string
                      - 'null'
                    description:
                      type:
                      - string
                      - 'null'
                    issueType:
                      type:
                      - string
                      - 'null'
                    issueKey:
                      type:
                      - string
                      - 'null'
                    jiraIssueId:
                      type:
                      - string
                      - 'null'
                  additionalProperties: false
              examples:
