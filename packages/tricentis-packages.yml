summary: >-
  Tricentis does not ship a general-purpose first-party client SDK for the qTest
  REST APIs (the Java SDK 1.4.9 was end-of-supported in June 2020, with users
  directed to generate clients from the published Swagger). The first-party
  packages that DO exist are runtime/automation clients: the NeoLoad CLI on PyPI,
  the NeoLoad as-code Java API clients and Maven plugin on Maven Central, the
  Testim CLI on npm, and the Tosca Execution Client and qTest Helm charts on the
  Tricentis GitHub organization.
