generated: '2026-08-02'
method: searched
status: published
source: https://docs.tricentis.com/tosca-cloud/en-us/content/ai_integration/connect_mcp_server.htm
summary: >-
  Tricentis ships remote, product-scoped MCP servers across its quality-engineering
  platform — Tosca Cloud, Tosca Commander (in-process), qTest and Tricentis Test
  Management for Jira. Every endpoint is TENANT-SCOPED, so there is no single public
  MCP URL and tools/list cannot be introspected anonymously (the TTM4J endpoint
  answers HTTP 401 "Invalid or missing token." to an unauthenticated tools/list).
  The tool inventories below are the provider's own published lists: the Tosca Cloud
  registry is harvested verbatim from the Apache-2.0 Tricentis/mcp-skills repository,
  and the TTM4J list from the Tricentis connection documentation.
servers:
- name: tosca-cloud
  product: Tricentis Tosca Cloud
  transport: http
  url_template: https://<tenant>.my.tricentis.com/<workspace>/_mcp/api/mcp
  url_note: workspace defaults to "default"; connect via npx mcp-remote on local port 56874
  docs: https://docs.tricentis.com/tosca-cloud/en-us/content/ai_integration/connect_mcp_server.htm
  auth:
    type: oauth2
    client_id: MCPServer
    scope: tta
  tool_count: 51
  tools_source: https://github.com/Tricentis/mcp-skills/blob/main/Tosca/Cloud/CLI/claude/skills/tosca-cloud/reference/tools-catalog.md
- name: qtest
  product: Tricentis qTest
  transport: http
  url_template: https://<tenant>.qtestnet.com/mcp
  docs: https://docs.tricentis.com/qtest-saas/content/manager/ai_integration/connect_qtest_mcp.htm
  auth:
    type: http
    scheme: bearer
    token_source: qTest Resources page, API & SDK section
  tools_source: docs
  tools_note: >-
    Tricentis documents the qTest MCP capability set narratively (create and edit
    modules and test cases, manage requirements and defects, view test runs) rather
    than as a named tool list; the live tools/list is tenant- and token-gated, so no
    verbatim tool names are recorded here rather than inventing them.
- name: ttm4j
  product: Tricentis Test Management for Jira
  transport: streamable-http
  url: https://ttm4j.tricentis.com/v1/mcp
  docs: https://docs.tricentis.com/ttm-for-jira/content/ai_integration/connect_to_mcp.htm
  auth:
    type: apiKey
    in: header
    parameter: Authorization
  probe:
    method: tools/list
    url: https://ttm4j.tricentis.com/v1/mcp
    http_status: 401
    body: Invalid or missing token.
    date: '2026-08-02'
  tool_count: 9
  tools_source: https://docs.tricentis.com/ttm-for-jira/content/ai_integration/connect_to_mcp.htm
- name: tosca-commander
  product: Tricentis Tosca Commander
  transport: http
  url_template: http://localhost:46248
  url_note: in-process MCP server hosted by Tosca Commander; default port 46248, configurable
  docs: https://docs.tricentis.com/tosca-2026.1/en-us/content/mcp/overview.htm
  auth:
    type: none
    note: localhost-only, bound to the running Commander workspace
clients_supported:
- Cursor
- Claude
- Visual Studio Code
- Windsurf
ttm4j_tools:
- {name: GetTestCasesByProject, category: test-cases, description: Retrieve test cases for a project with customizable fields and pagination.}
- {name: CreateTestCases, category: test-cases, description: Add new test cases with steps and metadata; supports batches.}
- {name: UpdateTestCase, category: test-cases, description: Modify properties on an existing test case.}
- {name: DeleteTestCase, category: test-cases, description: Permanently remove a test case.}
- {name: LinkRequirementsToTestCase, category: requirements, description: Associate requirements with a specific test case.}
- {name: CreateRequirements, category: requirements, description: Create new requirements in a project.}
- {name: GetTestCaseFolders, category: folders, description: Retrieve folder hierarchies with filtering options.}
- {name: CreateTestCaseFolders, category: folders, description: Create nested folder structures.}
- {name: UpdateTestCaseFolders, category: folders, description: Rename or reorganize existing folders.}
