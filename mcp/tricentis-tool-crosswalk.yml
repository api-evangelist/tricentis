summary: >-
  Binds Tricentis' published MCP tools to the REST operations that back them. The
  Tricentis Test Management for Jira (TTM4J) MCP tool list maps cleanly onto the
  TTM4J OpenAPI, which is the only Tricentis surface where the same product publishes
  both an MCP tool list and a machine-readable REST contract. The Tosca Cloud MCP
  registry (51 tools) has NO public REST counterpart — Tosca Cloud publishes no
  OpenAPI — so every Tosca tool is recorded as mcp_only, which is a real surface
  divergence, not a gap to paper over. The TTM4J OpenAPI declares no operationIds,
  so REST operations are identified by "METHOD path" as published.
